<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current to target with sequenced roadmap">
<!-- FIGURE 17.1 REQUIRED ELEMENTS
Must appear as a process canvas: current state and target state as
endpoints, with a sequenced set of steps between them (inventory,
classification, proportionate process) shown as dependent on each other
in a fixed order rather than as an unordered list. Entry condition: a
current-state assessment under 17.2 has identified the gap. Exit
condition: the sequence from current to target is explicit and ordered.
Deliberately excluded: the requirements-gathering mechanics of 17.5. Must
work in black and white.
SOURCE: original; the sequence follows this chapter's own section 17.4
argument, tied to the dependency Chapter 3 already established.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Current to target with sequenced roadmap</title>
