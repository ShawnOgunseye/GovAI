<svg viewBox="0 0 900 590" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Assessment process flow">
<!-- FIGURE 14.1 REQUIRED ELEMENTS
Must appear as a process canvas: the five assessment components in
sequence (system description, risk identification, mitigation, residual
risk, documented decision with named accountability), with the
consultation methods from 14.2 explicitly feeding the risk identification
step rather than sitting outside the process. Entry condition: a system
has been classified under Chapter 3 and an assessment is being opened.
Exit condition: a documented decision exists with a named accountable
party. Deliberately excluded: the scoring mechanics of 14.3 (Figure 14.2
owns that). Must work in black and white.
SOURCE: original; the five-component structure is this chapter's own
synthesis of section 14.1's argument, laid out as a sequential canvas.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Assessment process flow</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="590" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 14.1 &#183; Assessment process flow</text>
<rect x="30" y="58" width="430" height="62" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="80" class="bx" font-weight="700" fill="#1a2230">1. SYSTEM DESCRIPTION</text>
<text x="42" y="98" class="sm" fill="#46536b">what the system does, who it affects,</text>
<text x="42" y="113" class="sm" fill="#46536b">and in what context (14.1)</text>
<rect x="30" y="146" width="430" height="78" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="168" class="bx" font-weight="700" fill="#1a2230">2. RISK IDENTIFICATION</text>
<text x="42" y="186" class="sm" fill="#46536b">risk categories from Ch. 1's harms</text>
<text x="42" y="201" class="sm" fill="#46536b">taxonomy and Ch. 3's classification</text>
<text x="42" y="216" class="sm" fill="#46536b">factors; focus shifts by system class (14.1)</text>
<rect x="30" y="250" width="430" height="78" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="272" class="bx" font-weight="700" fill="#1a2230">3. MITIGATION</text>
<text x="42" y="290" class="sm" fill="#46536b">control assigned per significant risk:</text>
<text x="42" y="305" class="sm" fill="#46536b">technical, procedural, or contractual,</text>
<text x="42" y="320" class="sm" fill="#46536b">with a named owner (14.4)</text>
<rect x="30" y="354" width="430" height="78" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="376" class="bx" font-weight="700" fill="#1a2230">4. RESIDUAL RISK</text>
<text x="42" y="394" class="sm" fill="#46536b">what remains once the control is</text>
<text x="42" y="409" class="sm" fill="#46536b">applied, including gaps Ch. 7's testing</text>
<text x="42" y="424" class="sm" fill="#46536b">already showed were narrower (14.5)</text>
<rect x="30" y="458" width="430" height="62" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="480" class="bx" font-weight="700" fill="#1a2230">5. DOCUMENTED DECISION</text>
<text x="42" y="498" class="sm" fill="#46536b">named accountability: who accepted</text>
<text x="42" y="513" class="sm" fill="#46536b">the residual risk, and on what basis (14.5)</text>
<line x1="245.0" y1="120.0" x2="245.0" y2="138.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="245.0,146.0 241.0,138.0 249.0,138.0" fill="#1a2230"/>
<line x1="245.0" y1="224.0" x2="245.0" y2="242.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="245.0,250.0 241.0,242.0 249.0,242.0" fill="#1a2230"/>
<line x1="245.0" y1="328.0" x2="245.0" y2="346.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="245.0,354.0 241.0,346.0 249.0,346.0" fill="#1a2230"/>
<line x1="245.0" y1="432.0" x2="245.0" y2="450.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="245.0,458.0 241.0,450.0 249.0,450.0" fill="#1a2230"/>
<rect x="510" y="146" width="370" height="78" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="522" y="168" class="bx" font-weight="700" fill="#46536b">CONSULTATION METHODS (14.2)</text>
<text x="522" y="186" class="sm" fill="#46536b">proxy consultation, complaint records,</text>
<text x="522" y="201" class="sm" fill="#46536b">published research, structured</text>
<text x="522" y="216" class="sm" fill="#46536b">adversarial review, outcome analysis</text>
<line x1="510.0" y1="185.0" x2="476.0" y2="185.0" stroke="#46536b" stroke-width="1.8"/><polygon points="468.0,185.0 476.0,181.0 476.0,189.0" fill="#46536b"/>
<line x1="20" y1="540" x2="880" y2="540" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="556" class="sm" fill="#46536b">Consultation feeds risk identification directly rather than sitting outside the process; an assessment run</text>
<text x="20" y="574" class="sm" fill="#46536b">without it is missing an input the remaining four components depend on, not a smaller version of the same one.</text>
</svg>