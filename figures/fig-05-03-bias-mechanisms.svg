<svg viewBox="0 0 900 482" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0503t fig0503d" aria-label="Bias mechanisms and their remedies">
<title id="fig0503t">Bias mechanisms and their remedies</title>
<desc id="fig0503d">Three columns, historical bias, measurement bias, and selection bias, each with a one-line definition, a named documented instance, and a remedy distinct in kind from the other two columns' remedies: a different label or population for historical bias, a different variable for measurement bias, and deliberate, verified inclusion of the missing population for selection bias. A dataset can pass every accuracy, completeness, consistency, timeliness, and validity test and still carry any one of the three, since they are not mutually exclusive within a single dataset.</desc>
<!-- FIGURE 5.3 REQUIRED ELEMENTS
Comparison canvas, three columns: historical, measurement, selection bias.
Each column: one-line definition, a named documented instance, and a
remedy distinct in kind from the other two columns' remedies. Must show
the three remedies are different kinds of fix, not variations on one.
Excluded: statistical detection formulas (Chapter 7's job). Colour does not
distinguish the three mechanisms; position and labelling do.
SOURCE: mechanisms are standard in the fairness literature; the pairing of
a governance remedy to each is this book's structuring choice. Instances
verified against section 5.6's text (fraud labels/investigation pattern,
healthcare cost proxy, Gender Shades aggregate error rates 0.8% to
20.8-34.7%, benchmark composition, not training-data composition, as the
documented finding).
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x].
Content re-verified against the current section 5.6 prose 13 Sep 2026; no
factual change required. Accessibility markup upgraded to the title/desc
plus aria-labelledby pair used from fig-18-01 forward.
-->
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="482" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 5.3 &#183; Bias mechanisms and their remedies</text>
<rect x="30" y="96" width="267" height="94" rx="4" fill="#1a2230"/>
<text x="163" y="118" class="cls" fill="#ffffff" text-anchor="middle">HISTORICAL BIAS</text>
<text x="163" y="138" class="sm" fill="#ffffff" text-anchor="middle">data accurately records an</text>
<text x="163" y="153" class="sm" fill="#ffffff" text-anchor="middle">unjust world</text>
<rect x="30" y="206" width="267" height="90" rx="4" fill="#eef1f5" stroke="#8794a8" stroke-width="1.2"/>
<text x="40" y="224" class="sm" fill="#46536b" font-weight="700">INSTANCE</text>
<text x="40" y="242" class="sm" fill="#1a2230">fraud labels reflecting</text>
<text x="40" y="257" class="sm" fill="#1a2230">who investigators</text>
<text x="40" y="272" class="sm" fill="#1a2230">scrutinized</text>
<rect x="30" y="312" width="267" height="102" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="40" y="330" class="sm" fill="#1a2230" font-weight="700">REMEDY</text>
<text x="40" y="348" class="sm" fill="#1a2230">different label, different</text>
<text x="40" y="363" class="sm" fill="#1a2230">population, or an explicit</text>
<text x="40" y="378" class="sm" fill="#1a2230">decision not to reproduce</text>
<text x="40" y="393" class="sm" fill="#1a2230">the pattern</text>
<rect x="317" y="96" width="267" height="94" rx="4" fill="#1a2230"/>
<text x="450" y="118" class="cls" fill="#ffffff" text-anchor="middle">MEASUREMENT BIAS</text>
<text x="450" y="138" class="sm" fill="#ffffff" text-anchor="middle">the recorded variable</text>
<text x="450" y="153" class="sm" fill="#ffffff" text-anchor="middle">means something different</text>
<text x="450" y="168" class="sm" fill="#ffffff" text-anchor="middle">across groups</text>
<rect x="317" y="206" width="267" height="90" rx="4" fill="#eef1f5" stroke="#8794a8" stroke-width="1.2"/>
<text x="327" y="224" class="sm" fill="#46536b" font-weight="700">INSTANCE</text>
<text x="327" y="242" class="sm" fill="#1a2230">healthcare cost used as a</text>
<text x="327" y="257" class="sm" fill="#1a2230">proxy for healthcare need</text>
<rect x="317" y="312" width="267" height="102" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="327" y="330" class="sm" fill="#1a2230" font-weight="700">REMEDY</text>
<text x="327" y="348" class="sm" fill="#1a2230">a variable that tracks the</text>
<text x="327" y="363" class="sm" fill="#1a2230">actual target, not the</text>
<text x="327" y="378" class="sm" fill="#1a2230">proxy</text>
<rect x="603" y="96" width="267" height="94" rx="4" fill="#1a2230"/>
<text x="737" y="118" class="cls" fill="#ffffff" text-anchor="middle">SELECTION BIAS</text>
<text x="737" y="138" class="sm" fill="#ffffff" text-anchor="middle">cases that exist in the</text>
<text x="737" y="153" class="sm" fill="#ffffff" text-anchor="middle">world are absent from the</text>
<text x="737" y="168" class="sm" fill="#ffffff" text-anchor="middle">data</text>
<rect x="603" y="206" width="267" height="90" rx="4" fill="#eef1f5" stroke="#8794a8" stroke-width="1.2"/>
<text x="613" y="224" class="sm" fill="#46536b" font-weight="700">INSTANCE</text>
<text x="613" y="242" class="sm" fill="#1a2230">Gender Shades:</text>
<text x="613" y="257" class="sm" fill="#1a2230">darker-skinned women</text>
<text x="613" y="272" class="sm" fill="#1a2230">underrepresented in</text>
<text x="613" y="287" class="sm" fill="#1a2230">evaluation benchmarks</text>
<rect x="603" y="312" width="267" height="102" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="613" y="330" class="sm" fill="#1a2230" font-weight="700">REMEDY</text>
<text x="613" y="348" class="sm" fill="#1a2230">deliberate, verified</text>
<text x="613" y="363" class="sm" fill="#1a2230">inclusion of the missing</text>
<text x="613" y="378" class="sm" fill="#1a2230">population</text>
<line x1="30" y1="428" x2="870" y2="428" stroke="#c9d1dc" stroke-width="1"/>
<text x="30" y="452" class="sm" fill="#46536b">Three columns, three different repairs: a label or population change, a variable change, and an inclusion change.</text>
<text x="30" y="470" class="sm" fill="#46536b">A dataset can be clean by every quality-dimension test in section 5.3 and still carry any one of the three.</text>
</svg>