<svg viewBox="0 0 900 372" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Progressive rollout with halt gates">
<!-- FIGURE 8.2 REQUIRED ELEMENTS
Must appear as a process canvas: staged expansion over time (stage 1
narrow blast radius through to full deployment), with a halt gate between
each stage that must be explicitly passed, not merely not-yet-failed.
Must show the agentic variant: staging by permission scope rather than
population size. Entry condition: deployment approved (8.4). Exit
condition: full rollout, or a halted stage with the halt criterion that
triggered it named. Deliberately excluded: the deployment decision itself
(8.4's box). Must work in black and white.
SOURCE: original; staged rollout and halt-gate structure is standard
release-engineering practice, adapted here to the population and
permission-scope dimensions this book's systems require.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Progressive rollout with halt gates</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="372" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 8.2 &#183; Progressive rollout with halt gates</text>
<text x="30" y="66" class="col" fill="#46536b">BY POPULATION (predictive / generative)</text>
<rect x="30" y="80" width="190" height="70" rx="4" fill="#1a2230"/>
<text x="125.0" y="106" class="bx" fill="#ffffff" text-anchor="middle">STAGE 1</text>
<text x="125.0" y="122" class="bx" fill="#ffffff" text-anchor="middle">small pilot</text>
<text x="125.0" y="138" class="bx" fill="#ffffff" text-anchor="middle">site</text>
<rect x="225.0" y="101.0" width="60" height="28" rx="3" fill="#8a3324"/>
<text x="255.0" y="120.0" class="sm" fill="#ffffff" text-anchor="middle" font-weight="700">HALT GATE</text>
<rect x="290" y="80" width="190" height="70" rx="4" fill="#1a2230"/>
<text x="385.0" y="106" class="bx" fill="#ffffff" text-anchor="middle">STAGE 2</text>
<text x="385.0" y="122" class="bx" fill="#ffffff" text-anchor="middle">expanded</text>
<text x="385.0" y="138" class="bx" fill="#ffffff" text-anchor="middle">sites</text>
<rect x="485.0" y="101.0" width="60" height="28" rx="3" fill="#8a3324"/>
<text x="515.0" y="120.0" class="sm" fill="#ffffff" text-anchor="middle" font-weight="700">HALT GATE</text>
<rect x="550" y="80" width="190" height="70" rx="4" fill="#1a2230"/>
<text x="645.0" y="106" class="bx" fill="#ffffff" text-anchor="middle">STAGE 3</text>
<text x="645.0" y="122" class="bx" fill="#ffffff" text-anchor="middle">full</text>
<text x="645.0" y="138" class="bx" fill="#ffffff" text-anchor="middle">population</text>
<text x="30" y="172" class="sm" fill="#8a3324">Each gate requires a positive check against halt criteria fixed before launch, not merely the absence of a failure so far.</text>
<line x1="20" y1="212" x2="880" y2="212" stroke="#c9d1dc" stroke-width="1"/>
<text x="30" y="242" class="col" fill="#46536b">BY PERMISSION SCOPE (agentic)</text>
<rect x="30" y="256" width="190" height="70" rx="4" fill="#8a3324"/>
<text x="125.0" y="282" class="bx" fill="#ffffff" text-anchor="middle">STAGE 1</text>
<text x="125.0" y="298" class="bx" fill="#ffffff" text-anchor="middle">propose only,</text>
<text x="125.0" y="314" class="bx" fill="#ffffff" text-anchor="middle">cannot commit</text>
<rect x="225.0" y="277.0" width="60" height="28" rx="3" fill="#1a2230"/>
<text x="255.0" y="296.0" class="sm" fill="#ffffff" text-anchor="middle" font-weight="700">HALT GATE</text>
<rect x="290" y="256" width="190" height="70" rx="4" fill="#8a3324"/>
<text x="385.0" y="282" class="bx" fill="#ffffff" text-anchor="middle">STAGE 2</text>
<text x="385.0" y="298" class="bx" fill="#ffffff" text-anchor="middle">commit within</text>
<text x="385.0" y="314" class="bx" fill="#ffffff" text-anchor="middle">pre-approved slots</text>
<rect x="485.0" y="277.0" width="60" height="28" rx="3" fill="#1a2230"/>
<text x="515.0" y="296.0" class="sm" fill="#ffffff" text-anchor="middle" font-weight="700">HALT GATE</text>
<rect x="550" y="256" width="190" height="70" rx="4" fill="#8a3324"/>
<text x="645.0" y="282" class="bx" fill="#ffffff" text-anchor="middle">STAGE 3</text>
<text x="645.0" y="298" class="bx" fill="#ffffff" text-anchor="middle">full scheduling</text>
<text x="645.0" y="314" class="bx" fill="#ffffff" text-anchor="middle">autonomy</text>
<text x="30" y="352" class="sm" fill="#1a2230">Population reached can be 100% from day one; what stages is the scope of what the agent is permitted to do.</text></svg>