<svg viewBox="0 0 900 626" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Affordance axes mapped to the controls each one enables">
<!-- FIGURE 6.1 REQUIRED ELEMENTS
Must appear: the eight affordance axes from section 6.2 (structured output,
tool scoping, instruction hierarchy, context handling, confidence/
abstention, modality, latency/cost, deployment option), each paired with
the specific control it enables or forecloses. Entry condition: a
candidate model is being evaluated. Exit condition: the axes that
determine available controls are named, before any accuracy comparison.
Deliberately excluded: named models, named benchmark scores, market
comparison. Must work in black and white.
SOURCE: original; the axis list is this book's own synthesis of properties
documented across model provider system cards and API documentation, not a
reproduction of any single vendor's framework.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Affordance axes mapped to the controls each one enables</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="626" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 6.1 &#183; Affordance axes mapped to the controls each enables</text>
<text x="30" y="90" class="col" fill="#46536b">AFFORDANCE AXIS</text>
<text x="310" y="90" class="col" fill="#46536b">CONTROL IT ENABLES OR FORECLOSES</text>
<line x1="20" y1="100" x2="880" y2="100" stroke="#1a2230" stroke-width="1.6"/>
<rect x="20" y="100" width="860" height="52" fill="#eef1f5"/>
<text x="30" y="122" class="bx" font-weight="700" fill="#1a2230">Structured output</text>
<text x="310" y="120" class="sm" fill="#1a2230">A machine-checkable output gate: a field constrained to a</text>
<text x="310" y="135" class="sm" fill="#1a2230">fixed set of values, validated before use</text>
<line x1="20" y1="152" x2="880" y2="152" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="152" width="860" height="52" fill="#ffffff"/>
<text x="30" y="174" class="bx" font-weight="700" fill="#1a2230">Tool calling, scoped permissions</text>
<text x="310" y="172" class="sm" fill="#1a2230">A narrow, logged, auditable action set (Ch. 12), instead of</text>
<text x="310" y="187" class="sm" fill="#1a2230">wholesale system access</text>
<line x1="20" y1="204" x2="880" y2="204" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="204" width="860" height="52" fill="#eef1f5"/>
<text x="30" y="226" class="bx" font-weight="700" fill="#1a2230">Instruction hierarchy</text>
<text x="310" y="224" class="sm" fill="#1a2230">Guardrails that hold under adversarial or unexpected user</text>
<text x="310" y="239" class="sm" fill="#1a2230">input, not just typical input</text>
<line x1="20" y1="256" x2="880" y2="256" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="256" width="860" height="52" fill="#ffffff"/>
<text x="30" y="278" class="bx" font-weight="700" fill="#1a2230">Context handling</text>
<text x="310" y="276" class="sm" fill="#1a2230">Retrieval filtering discipline (Ch. 5) rather than dumping an</text>
<text x="310" y="291" class="sm" fill="#1a2230">entire corpus into context</text>
<line x1="20" y1="308" x2="880" y2="308" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="308" width="860" height="52" fill="#eef1f5"/>
<text x="30" y="330" class="bx" font-weight="700" fill="#1a2230">Confidence and abstention</text>
<text x="310" y="328" class="sm" fill="#1a2230">Routing low-confidence output to a human; blocking a request</text>
<text x="310" y="343" class="sm" fill="#1a2230">that falls outside scope</text>
<line x1="20" y1="360" x2="880" y2="360" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="360" width="860" height="52" fill="#ffffff"/>
<text x="30" y="382" class="bx" font-weight="700" fill="#1a2230">Modality</text>
<text x="310" y="380" class="sm" fill="#1a2230">Which of this book's controls even apply; a text-audit control</text>
<text x="310" y="395" class="sm" fill="#1a2230">does nothing for images</text>
<line x1="20" y1="412" x2="880" y2="412" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="412" width="860" height="52" fill="#eef1f5"/>
<text x="30" y="434" class="bx" font-weight="700" fill="#1a2230">Latency and cost</text>
<text x="310" y="432" class="sm" fill="#1a2230">Whether human review, or a self-consistency check, is</text>
<text x="310" y="447" class="sm" fill="#1a2230">operationally feasible at all</text>
<line x1="20" y1="464" x2="880" y2="464" stroke="#c9d1dc" stroke-width="1"/>
<rect x="20" y="464" width="860" height="52" fill="#ffffff"/>
<text x="30" y="486" class="bx" font-weight="700" fill="#1a2230">Deployment option</text>
<text x="310" y="484" class="sm" fill="#1a2230">What data may reach the model at all, under Ch. 5 and Ch. 2</text>
<text x="310" y="499" class="sm" fill="#1a2230">data-handling constraints</text>
<line x1="20" y1="516" x2="880" y2="516" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="546" class="sm" fill="#46536b">Read as a lookup table, not a ranking: which axes matter most depends on what the system will do.</text>
<text x="20" y="564" class="sm" fill="#46536b">An agentic system weights tool scoping first; a system that never acts can deprioritize it.</text>
</svg>