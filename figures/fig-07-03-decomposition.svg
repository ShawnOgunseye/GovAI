<svg viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0703t fig0703d" aria-label="Decomposing an unspecifiable property into a testable requirement">
<title id="fig0703t">Decomposing an unspecifiable property into a testable requirement</title>
<desc id="fig0703d">A process canvas reading top to bottom as a derivation: an unspecifiable property such as "the system does not fabricate an answer" decomposes into four dependent elements, a verifiable proxy, a stated threshold, a verification method, and a documented residual, each populated with the book's sentinel evaluation example. The residual sits at the same visual weight as the pass or fail result, not as an afterthought, because a residual omitted is a claim of completeness the evidence does not support.</desc>
<!-- FIGURE 7.3 REQUIRED ELEMENTS
Must appear as a process canvas: the unspecifiable property at the top,
decomposing into the four elements (verifiable proxy, stated threshold,
verification method, documented residual) as sequential or parallel
components, with the sentinel evaluation example populating each of the
four. Must show the residual explicitly, not as an afterthought box but as
a required, equally weighted output alongside the pass/fail result.
Entry condition: a property that cannot be directly specified. Exit
condition: a testable requirement plus a named residual, not a false claim
of complete verification. Must work in black and white.
SOURCE: original; the four-part decomposition method is this book's own
structuring of standard verification-and-validation practice applied to
the specific case of properties that resist direct specification.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x].
Content re-verified against this section's current text 13 Sep 2026; no
factual change required. Accessibility markup upgraded to the title/desc
plus aria-labelledby pair used from fig-18-01 forward.
-->
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 7.3 &#183; Decomposing an unspecifiable property</text>
<rect x="200.0" y="65" width="500" height="60" rx="4" fill="#8a3324"/>
<text x="450.0" y="90" class="cls" fill="#ffffff" text-anchor="middle">UNSPECIFIABLE PROPERTY</text>
<text x="450.0" y="110" class="sm" fill="#ffffff" text-anchor="middle">"the system does not fabricate an answer"</text>
<line x1="450.0" y1="125.0" x2="450.0" y2="166.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="450.0,174.0 446.0,166.0 454.0,166.0" fill="#1a2230"/>
<rect x="30.0" y="180" width="195" height="150" rx="4" fill="#1a2230"/>
<text x="127.5" y="204" class="col" fill="#ffffff" text-anchor="middle">1. VERIFIABLE PROXY</text>
<text x="127.5" y="226" class="sm" fill="#ffffff" text-anchor="middle">rate of correctly</text>
<text x="127.5" y="241" class="sm" fill="#ffffff" text-anchor="middle">declining to answer items</text>
<text x="127.5" y="256" class="sm" fill="#ffffff" text-anchor="middle">that cannot be answered</text>
<text x="127.5" y="271" class="sm" fill="#ffffff" text-anchor="middle">from the material given</text>
<line x1="227.0" y1="255.0" x2="236.7" y2="255.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="244.7,255.0 236.7,259.0 236.7,251.0" fill="#1a2230"/>
<rect x="246.7" y="180" width="195" height="150" rx="4" fill="#1a2230"/>
<text x="344.2" y="204" class="col" fill="#ffffff" text-anchor="middle">2. STATED THRESHOLD</text>
<text x="344.2" y="226" class="sm" fill="#ffffff" text-anchor="middle">a specific pass rate on</text>
<text x="344.2" y="241" class="sm" fill="#ffffff" text-anchor="middle">the sentinel set, agreed</text>
<text x="344.2" y="256" class="sm" fill="#ffffff" text-anchor="middle">in advance by whoever is</text>
<text x="344.2" y="271" class="sm" fill="#ffffff" text-anchor="middle">accountable for release</text>
<line x1="443.7" y1="255.0" x2="453.4" y2="255.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="461.4,255.0 453.4,259.0 453.4,251.0" fill="#1a2230"/>
<rect x="463.4" y="180" width="195" height="150" rx="4" fill="#1a2230"/>
<text x="560.9" y="204" class="col" fill="#ffffff" text-anchor="middle">3. VERIFICATION METHOD</text>
<text x="560.9" y="226" class="sm" fill="#ffffff" text-anchor="middle">sentinel items rotated so</text>
<text x="560.9" y="241" class="sm" fill="#ffffff" text-anchor="middle">the system cannot be tuned</text>
<text x="560.9" y="256" class="sm" fill="#ffffff" text-anchor="middle">to the visible set; a</text>
<text x="560.9" y="271" class="sm" fill="#ffffff" text-anchor="middle">portion held out entirely</text>
<line x1="660.4" y1="255.0" x2="670.1" y2="255.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="678.1,255.0 670.1,259.0 670.1,251.0" fill="#1a2230"/>
<rect x="680.0999999999999" y="180" width="195" height="150" rx="4" fill="#8a3324"/>
<text x="777.5999999999999" y="204" class="col" fill="#ffffff" text-anchor="middle">4. DOCUMENTED RESIDUAL</text>
<text x="777.5999999999999" y="226" class="sm" fill="#ffffff" text-anchor="middle">does not establish that</text>
<text x="777.5999999999999" y="241" class="sm" fill="#ffffff" text-anchor="middle">any specific real output</text>
<text x="777.5999999999999" y="256" class="sm" fill="#ffffff" text-anchor="middle">was truthful, or behavior</text>
<text x="777.5999999999999" y="271" class="sm" fill="#ffffff" text-anchor="middle">on unlike categories</text>
<line x1="20" y1="356" x2="880" y2="356" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="380" class="sm" fill="#1a2230">The residual carries equal weight to the pass or fail result, not an afterthought: a passed sentinel run establishes a general</text>
<text x="20" y="398" class="sm" fill="#1a2230">propensity, at the time it was run, on this narrow category. It does not verify any specific real output as truthful.</text>
<line x1="20" y1="406" x2="880" y2="406" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="430" class="sm" fill="#46536b">Conventional software can decompose toward a zero residual over a bounded input space. Over an open-ended input space,</text>
<text x="20" y="448" class="sm" fill="#46536b">the residual cannot reach zero. A characterized, accepted residual is the standard, not a placeholder for a better one.</text>
</svg>