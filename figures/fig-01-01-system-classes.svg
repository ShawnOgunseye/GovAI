<text x="24.0" y="106.0" font-size="12.5" font-weight="700" fill="#1A1A1A">COMMON CONTROLS</text>
<text x="24.0" y="122.0" font-size="9.3" fill="#1A1A1A">Apply to every function</text>
<text x="24.0" y="134.4" font-size="9.3" fill="#1A1A1A">below, regardless of which</text>
<text x="24.0" y="146.8" font-size="9.3" fill="#1A1A1A">one is in use.</text>
<text x="220.0" y="106.0" font-size="9.6" font-weight="400" fill="#1A1A1A">Versioned system record;</text>
<text x="220.0" y="119.2" font-size="9.6" font-weight="400" fill="#1A1A1A">accountable owner</text>
<text x="434.0" y="106.0" font-size="9.6" font-weight="400" fill="#1A1A1A">Evidence sufficient for the</text>
<text x="434.0" y="119.2" font-size="9.6" font-weight="400" fill="#1A1A1A">decision</text>
<text x="648.0" y="106.0" font-size="9.6" font-weight="400" fill="#1A1A1A">Monitoring owner and incident</text>
<text x="648.0" y="119.2" font-size="9.6" font-weight="400" fill="#1A1A1A">route</text>
<text x="862.0" y="106.0" font-size="9.6" font-weight="400" fill="#1A1A1A">Affected person challenge and</text>
<text x="862.0" y="119.2" font-size="9.6" font-weight="400" fill="#1A1A1A">remedy where relevant</text>
<text x="1076.0" y="106.0" font-size="9.6" font-weight="400" fill="#1A1A1A">Change trigger, reassessment,</text>
<text x="1076.0" y="119.2" font-size="9.6" font-weight="400" fill="#1A1A1A">retention, retirement</text>
<line x1="20" y1="164.8" x2="1280" y2="164.8" stroke="#BFBFBF" stroke-width="1"/>
<text x="24.0" y="184.8" font-size="12.5" font-weight="700" fill="#1A1A1A">PREDICT OR RECOMMEND</text>
<text x="24.0" y="200.8" font-size="9.3" fill="#1A1A1A">Emits a judgment about</text>
<text x="24.0" y="213.2" font-size="9.3" fill="#1A1A1A">something real: a score,</text>
<text x="24.0" y="225.6" font-size="9.3" fill="#1A1A1A">rank, or class.</text>
<text x="220.0" y="184.8" font-size="9.6" font-weight="600" fill="#1A1A1A">Data and context validity;</text>
<text x="220.0" y="198.0" font-size="9.6" font-weight="600" fill="#1A1A1A">performance by relevant group;</text>
<text x="220.0" y="211.2" font-size="9.6" font-weight="600" fill="#1A1A1A">approved threshold</text>
<text x="434.0" y="184.8" font-size="9.6" font-weight="400" fill="#1A1A1A">Human or automated gate matched</text>
<text x="434.0" y="198.0" font-size="9.6" font-weight="400" fill="#1A1A1A">to consequence</text>
<text x="648.0" y="184.8" font-size="9.6" font-weight="400" fill="#1A1A1A">Drift and outcome monitoring</text>
<text x="862.0" y="184.8" font-size="9.6" font-weight="400" fill="#1A1A1A">Notice, explanation, appeal,</text>
<text x="862.0" y="198.0" font-size="9.6" font-weight="400" fill="#1A1A1A">correction</text>
<text x="1076.0" y="184.8" font-size="9.6" font-weight="400" fill="#1A1A1A">Reassess thresholds and model;</text>
<text x="1076.0" y="198.0" font-size="9.6" font-weight="400" fill="#1A1A1A">retire the version</text>
<line x1="20" y1="244.4" x2="1280" y2="244.4" stroke="#BFBFBF" stroke-width="1"/>
<text x="24.0" y="264.4" font-size="12.5" font-weight="700" fill="#1A1A1A">GENERATE CONTENT</text>
<text x="24.0" y="280.4" font-size="9.3" fill="#1A1A1A">Emits content that did not</text>
<text x="24.0" y="292.8" font-size="9.3" fill="#1A1A1A">exist before, checkable or</text>
<text x="24.0" y="305.2" font-size="9.3" fill="#1A1A1A">not.</text>
<text x="220.0" y="264.4" font-size="9.6" font-weight="600" fill="#1A1A1A">Corpus and supplier provenance;</text>
<text x="220.0" y="277.6" font-size="9.6" font-weight="600" fill="#1A1A1A">task evaluation; grounding design</text>
<text x="434.0" y="264.4" font-size="9.6" font-weight="600" fill="#1A1A1A">Verification where output is</text>
<text x="434.0" y="277.6" font-size="9.6" font-weight="600" fill="#1A1A1A">consequential; disclosure rule</text>
<text x="648.0" y="264.4" font-size="9.6" font-weight="400" fill="#1A1A1A">Abuse and quality monitoring;</text>
<text x="648.0" y="277.6" font-size="9.6" font-weight="400" fill="#1A1A1A">escalation</text>
<text x="862.0" y="264.4" font-size="9.6" font-weight="400" fill="#1A1A1A">Feedback, correction, takedown,</text>
<text x="862.0" y="277.6" font-size="9.6" font-weight="400" fill="#1A1A1A">remedy</text>
<text x="1076.0" y="264.4" font-size="9.6" font-weight="400" fill="#1A1A1A">Reassess model, retrieval source,</text>
<text x="1076.0" y="277.6" font-size="9.6" font-weight="400" fill="#1A1A1A">and policy; retire the version</text>
<line x1="20" y1="323.2" x2="1280" y2="323.2" stroke="#BFBFBF" stroke-width="1"/>
<text x="24.0" y="343.2" font-size="12.5" font-weight="700" fill="#1A1A1A">ACT OR EXECUTE</text>
<text x="24.0" y="359.2" font-size="9.3" fill="#1A1A1A">Proposes or takes an action</text>
<text x="24.0" y="371.6" font-size="9.3" fill="#1A1A1A">with a real consequence.</text>
<text x="220.0" y="343.2" font-size="9.6" font-weight="600" fill="#1A1A1A">Identity; delegated authority;</text>
<text x="220.0" y="356.4" font-size="9.6" font-weight="600" fill="#1A1A1A">tool and data permissions;</text>
<text x="220.0" y="369.6" font-size="9.6" font-weight="600" fill="#1A1A1A">adversarial testing</text>
<text x="434.0" y="343.2" font-size="9.6" font-weight="600" fill="#1A1A1A">Approval for consequential or</text>
<text x="434.0" y="356.4" font-size="9.6" font-weight="600" fill="#1A1A1A">irreversible action</text>
<text x="648.0" y="343.2" font-size="9.6" font-weight="600" fill="#1A1A1A">Scope enforcement; observability;</text>
<text x="648.0" y="356.4" font-size="9.6" font-weight="600" fill="#1A1A1A">interruption</text>
<text x="862.0" y="343.2" font-size="9.6" font-weight="400" fill="#1A1A1A">Action record; containment;</text>
<text x="862.0" y="356.4" font-size="9.6" font-weight="400" fill="#1A1A1A">rollback or compensation</text>
<text x="1076.0" y="343.2" font-size="9.6" font-weight="400" fill="#1A1A1A">Revoke authority; repair; verify;</text>
<text x="1076.0" y="356.4" font-size="9.6" font-weight="400" fill="#1A1A1A">close and learn</text>
<line x1="20" y1="402.8" x2="1280" y2="402.8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="20" y="428.8" font-size="13" fill="#1A1A1A">Bold marks the control that carries the greater emphasis for that function. Regular text marks a control that</text>
<text x="20" y="448.8" font-size="13" fill="#1A1A1A">still applies but is not the row&#8217;s main point. A deployment that predicts, generates, and acts needs every row.</text>
<text x="20" y="466.0" font-size="12" fill="#1A1A1A">Functions can overlap. Consequence, authority, context, and reversibility determine control strength.</text>
<text x="20" y="488.0" font-size="10.2" font-style="italic" fill="#1A1A1A" opacity="0.7">Author-proposed synthesis, not an observed universal process. Checked 13 Sep 2026.</text>
</g></svg>