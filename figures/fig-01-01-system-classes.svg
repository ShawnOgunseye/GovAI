<svg viewBox="0 0 1300 496" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0101t f0101d" aria-label="Different functions change the control mix">
<title id="f0101t">Different functions change the control mix</title>
<desc id="f0101d">A comparison table with four rows against five stage columns: before release, before consequence, during operation, after consequence, and change and closure. The first row lists baseline controls common to every function. The three rows below it, predict or recommend, generate content, and act or execute, add to that baseline in increasing order of control intensity. Predictive functions emphasise the gate before a judgment is acted on. Generative functions emphasise provenance and verification before release and before consequence. Agentic functions, in the bottom row, carry the heaviest and most concentrated controls, spanning identity, approval, and runtime enforcement, because by the time there is an output to inspect the action has often already occurred. This is an author-proposed synthesis, not a universal observed process.</desc>
<!-- REQUIRED ELEMENTS
  Rebuilt per CH pass-47 CH590/CH416 spec, method following the Chapter 18
  Figure 18.1 rebuild in Pass 32: a black/white/grey comparison table, no
  dot-grid, no unexplained weight, monochrome-verified, rendered and
  collision-checked before delivery.
  One black/white/grey comparison table. Four rows: common controls, predict
  or recommend, generate content, act or execute. Five stage columns: before
  release, before consequence, during operation, after consequence, change
  and closure. Bold text marks the control that carries greater emphasis for
  that function; regular text marks a control that still applies but is not
  the row's main point. The "act or execute" row is bold across most stages
  on purpose: that density, not a uniform grid, is the row's argument. The
  "common controls" row is never bold: it is the shared baseline, not a
  per-function emphasis.
  ROW ORDER adapted from CH's CH590 spec, which listed common controls last:
  placed first here as a baseline, with predict, generate, act following in
  increasing control intensity, so "act or execute" lands on the bottom row.
  The chapter text calls this "the bottom row" (the section 1.3 close and
  the section 1.8 coda both point at it); that reference only holds if the
  most control-dense function is the one at the bottom.
  EXCLUDED: filled/open dots, icons, gradients, colour coding.
  SOURCE: NIST AI RMF Core; NIST AI 600-1 Generative AI Profile; GAO-21-519SP.
  Table structure, cell content and emphasis pattern original, per CH590.
  REPLACES the dot-grid version flagged under CH008/CH416 (Pass 16) for
  unexplained dot weight and two rendered collisions.
  Pass 48 CH416 repair: added aria-label, moved title/desc immediately after
  the opening svg tag (both per CH's exact spec), and added a visible scope
  note under the legend so the figure states its own reading key without
  depending on body prose. Final-size type-scale/layout (CH416 defect 1,
  landscape vs two-panel) remains OPEN, logged in badw-book-log.md Pass 48;
  it is a page-format decision this pass did not make unilaterally.
  Pass 51 CH416 repair: every fill/stroke of #2B3A42 (a blue-tinted dark,
  not a neutral grey) replaced with #1A1A1A, matching the header ink
  already in use in this file. Palette is now #ffffff, #1A1A1A, #BFBFBF
  only. Re-checked well-formed (xmllint) and re-rendered (rsvg-convert)
  after the change; no clipping or collision introduced. The desc's
  "increasing order of control intensity" framing, which CH's Pass 51
  separately asked to remove, was left as is; see badw-book-log.md Pass 51
  for why (it restates the chapter's own section 1.3/1.7/1.8 walkthrough
  prose, and CH's own earlier CH590 spec, adopted in Pass 47, specified
  this exact row order and framing). Final-size type-scale/layout remains
  OPEN as in Pass 48.
  Checked 13 Sep 2026.
-->
