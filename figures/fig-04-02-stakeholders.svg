<!-- REQUIRED ELEMENTS
  Two axes: influence (capacity to affect whether the system proceeds) and interest.
  Four quadrants, each named, each with the party type it holds and the obligation it creates.
  The high-interest low-influence quadrant must be visually marked as the one that matters.
  Subjects must appear there, and the reason must be stated: they cannot advocate for themselves.
  EXCLUDED: a recommended sequence of engagement. Prose handles that.
  SOURCE: influence and interest as dimensions are conventional. The claim that harm
  concentrates in one quadrant, and the representation remedy, are ours.
  AUDIT: pass 1 [x] · pass 2 blind [x] · rendered and viewed [x]
  PASS 16 CH REVIEW (2026-09-13, not yet actioned): no mechanical collision
  found, but the quadrant model needs to stop presenting low-influence,
  low-interest as simply "record and leave" without a rights/vulnerability
  check, and needs a start condition, evidence input, engagement method,
  disagreement/recourse, and owner rather than only the influence/interest
  placement. Chapter 4 section 4.4's prose was separately hedged this pass
  (CH410); this figure has not been redrawn to match. Tracked at task #37.
  PASS 17 CH REVIEW (2026-09-13, actioned): CH429 established that this
  file's reference appears second in the chapter (line 167, after the
  intake figure at line 57) and so renders as Figure 4.2, while the
  filename and internal ids said fig-04-01/f0401. Renamed this pass from
  fig-04-01-stakeholders.svg to fig-04-02-stakeholders.svg, ids changed
  from f0401t/f0401d to f0402t/f0402d, and the chapter's own reference
  updated to match with a new stable anchor. The redraw items already
  logged above (PASS 16 CH REVIEW) remain open at task #37; this note only
  records the rename.
-->

<title id="f0402t">Affected parties by influence and interest</title>
<desc id="f0402d">A grid with influence on the vertical axis and interest on the horizontal. High influence with low interest holds legal, works councils and regulators, who can stop the system and are not thinking about it. High influence with high interest holds the sponsor and operational lead, who will be consulted anyway. Low influence with low interest can be recorded and left. Low influence with high interest holds the subjects of the system, and is marked as the quadrant where harm concentrates, because its occupants cannot advocate for themselves and most do not know the system exists.</desc>
<g font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

<text x="24" y="34" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" letter-spacing="1.2">INFLUENCE</text>
<text x="24" y="52" font-size="11" fill="#2B3A42" opacity="0.6">can affect whether it proceeds</text>
<text x="440" y="534" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" letter-spacing="1.2">INTEREST</text>
<text x="440" y="552" font-size="11" fill="#2B3A42" opacity="0.6">affected by the outcome</text>

<line x1="150" y1="70" x2="150" y2="500" stroke="#2B3A42" stroke-width="1.5"/>
<line x1="150" y1="500" x2="930" y2="500" stroke="#2B3A42" stroke-width="1.5"/>
<line x1="540" y1="70" x2="540" y2="500" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="150" y1="285" x2="930" y2="285" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 4"/>

<g font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" opacity="0.55">
<text x="120" y="96" text-anchor="end">HIGH</text><text x="120" y="494" text-anchor="end">LOW</text>
<text x="345" y="524" text-anchor="middle">LOW</text><text x="735" y="524" text-anchor="middle">HIGH</text>
</g>

<g>
<rect x="168" y="90" width="356" height="178" rx="4" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/>
<text x="192" y="126" font-size="15" font-weight="600" fill="#2B3A42">Can stop it, not thinking about it</text>
<text x="192" y="154" font-size="13" fill="#2B3A42">Legal. Works councils. In regulated</text>
<text x="192" y="174" font-size="13" fill="#2B3A42">sectors, the supervisory body.</text>
<text x="192" y="212" font-size="13" fill="#1A1A1A">Reach them early. Their objection</text>
<text x="192" y="232" font-size="13" fill="#1A1A1A">arrives after the design is fixed.</text>
</g>

<g>
<rect x="556" y="90" width="356" height="178" rx="4" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/>
<text x="580" y="126" font-size="15" font-weight="600" fill="#2B3A42">Will be consulted anyway</text>
<text x="580" y="154" font-size="13" fill="#2B3A42">The sponsor. The operational lead.</text>
<text x="580" y="192" font-size="13" fill="#1A1A1A">The task is not securing attention.</text>
<text x="580" y="212" font-size="13" fill="#1A1A1A">It is recording what they decided.</text>
</g>

<g>
<rect x="168" y="302" width="356" height="178" rx="4" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="1"/>
<text x="192" y="338" font-size="15" font-weight="600" fill="#2B3A42" opacity="0.6">Record and leave</text>
<text x="192" y="366" font-size="13" fill="#2B3A42" opacity="0.6">Where most of a stakeholder list</text>
<text x="192" y="386" font-size="13" fill="#2B3A42" opacity="0.6">ends up.</text>
</g>

<g>
<rect x="556" y="302" width="356" height="178" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="580" y="332" font-size="10.5" font-family="'IBM Plex Mono',monospace" fill="#1A1A1A" letter-spacing="1.2">WHERE HARM CONCENTRATES</text>
<text x="580" y="362" font-size="15" font-weight="600" fill="#1A1A1A">Cannot advocate for themselves</text>
<text x="580" y="390" font-size="13" fill="#2B3A42">The subjects. Most do not know</text>
<text x="580" y="410" font-size="13" fill="#2B3A42">the system exists.</text>
<text x="580" y="444" font-size="13" fill="#1A1A1A">Consultation is not available.</text>
<text x="580" y="464" font-size="13" fill="#1A1A1A">Representation and testing are.</text>
</g>
</g>
</svg>
