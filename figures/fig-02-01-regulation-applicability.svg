<title id="f0201t">Which regulations reach this system</title>
<desc id="f0201d">A single entry node on the left lists a system's own facts: its activity, its actors and their roles, its data, the population it affects, its deployment location, and its autonomy. Four arrows run from that node to four independent trigger tests, one per regulation this chapter covers: GDPR Article 3's territorial scope test, GDPR Article 22's solely-automated-decision test, an anti-discrimination test that names its statute and jurisdiction before applying that statute's own intent or effects rule, and the EU AI Act's Article 6 and Annex high-risk test. Each trigger test connects to its own result box stating what applies if the test is met; the Article 22 result box notes that its safeguards apply whether or not a statutory exception permits the decision. A footer band states that each regulation's result depends only on the shared facts against that regulation's own test, and that no regulation's result feeds another regulation's test.</desc>

<defs>
<marker id="arrow21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#46536b"/>
</marker>
</defs>

<style>
text { font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.ttl { font-size: 17px; font-weight: 700; fill: #1a2230; }
.col { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #46536b; }
.bx { font-size: 12.5px; fill: #1a2230; }
.sm { font-size: 11px; fill: #46536b; }
.em { font-size: 11px; font-style: italic; fill: #46536b; }
</style>

<g>
<text x="450" y="30" text-anchor="middle" class="ttl">Which regulations reach this system</text>

<!-- Entry node -->
<rect x="20" y="60" width="150" height="480" rx="6" fill="#eef1f5" stroke="#1a2230" stroke-width="1.8"/>
<text x="95" y="86" text-anchor="middle" class="col">ENTRY: SYSTEM FACTS</text>
<line x1="34" y1="98" x2="156" y2="98" stroke="#c9d1dc" stroke-width="1"/>
<text x="35" y="122" class="bx">activity</text>
<text x="35" y="146" class="bx">actors and roles</text>
<text x="35" y="170" class="bx">data</text>
<text x="35" y="194" class="bx">affected</text>
<text x="35" y="210" class="bx">population</text>
<text x="35" y="234" class="bx">deployment</text>
<text x="35" y="250" class="bx">location</text>
<text x="35" y="274" class="bx">autonomy</text>
<text x="95" y="520" text-anchor="middle" class="em">one fact set,</text>
<text x="95" y="536" text-anchor="middle" class="em">four independent tests</text>

<!-- Row 1: GDPR Article 3 -->
<line x1="170" y1="115" x2="210" y2="115" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="214" y="60" width="270" height="110" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="228" y="82" class="col">GDPR ARTICLE 3</text>
<text x="228" y="102" class="bx">Establishment in the EU, or</text>
<text x="228" y="120" class="bx">offering goods or services to,</text>
<text x="228" y="138" class="bx">or monitoring, people in the EU?</text>
<text x="228" y="158" class="sm">Presence in the EU alone is not the test.</text>

<line x1="484" y1="115" x2="524" y2="115" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="528" y="60" width="330" height="110" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="542" y="82" class="col">RESULT: GDPR APPLIES</text>
<text x="542" y="102" class="bx">Lawful basis under Article 6, plus an</text>
<text x="542" y="120" class="bx">Article 9 condition for special categories,</text>
<text x="542" y="138" class="bx">data minimization, purpose limitation,</text>
<text x="542" y="156" class="bx">and data subject rights. Section 2.1.</text>

<!-- Row 2: GDPR Article 22 -->
<line x1="170" y1="235" x2="210" y2="235" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="214" y="180" width="270" height="110" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="228" y="202" class="col">GDPR ARTICLE 22</text>
<text x="228" y="222" class="bx">Solely automated, with a legal or</text>
<text x="228" y="240" class="bx">similarly significant effect?</text>
<text x="228" y="258" class="sm">An exception permits the decision; it does not</text>
<text x="228" y="274" class="sm">remove the Article 22(3) safeguards.</text>

<line x1="484" y1="235" x2="524" y2="235" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="528" y="180" width="330" height="110" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="542" y="202" class="col">RESULT: ARTICLE 22 APPLIES</text>
<text x="542" y="222" class="bx">Human intervention, a route to express a</text>
<text x="542" y="240" class="bx">point of view, and a route to contest the</text>
<text x="542" y="258" class="bx">decision are required safeguards, exception</text>
<text x="542" y="276" class="bx">or not. Section 2.2.</text>

<!-- Row 3: anti-discrimination -->
<line x1="170" y1="355" x2="210" y2="355" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="214" y="300" width="270" height="110" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="228" y="322" class="col">ANTI-DISCRIMINATION LAW</text>
<text x="228" y="342" class="bx">Does a protected-basis outcome result,</text>
<text x="228" y="360" class="bx">for example in employment, credit, or</text>
<text x="228" y="378" class="bx">housing, even with no protected</text>
<text x="228" y="396" class="bx">attribute taken as an input?</text>

<line x1="484" y1="355" x2="524" y2="355" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="528" y="300" width="330" height="110" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="542" y="322" class="col">RESULT: DISCRIMINATION EXPOSURE</text>
<text x="542" y="342" class="bx">The statute and jurisdiction decide the test.</text>
<text x="542" y="360" class="bx">Title VII disparate impact needs no intent;</text>
<text x="542" y="378" class="bx">some AI-specific state laws, like Texas</text>
<text x="542" y="396" class="bx">TRAIGA, require it. Section 2.3.</text>

<!-- Row 4: EU AI Act -->
<line x1="170" y1="475" x2="210" y2="475" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="214" y="420" width="270" height="110" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="228" y="442" class="col">EU AI ACT ARTICLE 6</text>
<text x="228" y="462" class="bx">Annex I or Annex III entry, matching</text>
<text x="228" y="480" class="bx">intended purpose and product status,</text>
<text x="228" y="498" class="bx">actor role, no exclusion, and the</text>
<text x="228" y="516" class="bx">provision's current application date reached?</text>

<line x1="484" y1="475" x2="524" y2="475" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow21)"/>
<rect x="528" y="420" width="330" height="110" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.8"/>
<text x="542" y="442" class="col">RESULT: AI ACT HIGH-RISK OBLIGATIONS</text>
<text x="542" y="462" class="bx">Risk management across the lifecycle,</text>
<text x="542" y="480" class="bx">data governance, technical documentation,</text>
<text x="542" y="498" class="bx">logging, human oversight, accuracy,</text>
<text x="542" y="516" class="bx">robustness, and cybersecurity. Section 2.5.</text>

<!-- Exit band -->
<rect x="20" y="560" width="838" height="70" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.8"/>
<text x="40" y="582" class="col">EXIT: FOUR INDEPENDENT RESULTS</text>
<text x="40" y="602" class="bx">Each result depends only on the shared facts against that regulation's own test. A "yes" under</text>
<text x="40" y="620" class="bx">one regulation is not evidence for another regulation's test, and none of the four is derived from an internal risk tier.</text>
</g>
</svg>
