<svg viewBox="0 0 820 470" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0303t f0303d">
<!-- REQUIRED ELEMENTS
  Four stages in a closed loop: discovery, boundary, inventory, classification.
  The loop must READ AS A LOOP, not a pipeline with a return arrow bolted on.
  Each stage: what it answers, and what it produces.
  The change event is what closes the loop; it re-enters at BOUNDARY, not at
  discovery, because a change to a recorded system does not need to be
  rediscovered, it needs to be re-bounded. This is the whole point of the
  figure and the distinction section 3.4 makes between the two kinds of
  shadow AI.
  Discovery is marked as the usual ENTRY for an organization starting out,
  which is why teaching order and operating order differ (section 3.4 prose).
  EXCLUDED: the four discovery methods. They are section 3.4's own list and
  would overload a figure about the cycle.
  SOURCE: original, derived from section 3.2 to 3.4 prose. No external
  framework states this loop in this form.
  AUDIT: pass 1 [x] 2026-09-21  pass 2 blind [ ]
-->
<title id="f0303t">The governance loop: discovery, boundary, inventory, classification</title>
<desc id="f0303d">Four stages arranged in a closed cycle. Discovery surfaces a candidate. The boundary test defines the governed system. The inventory records the system and its linked models. Classification assigns governance attention. A change to the deployment re-enters at the boundary test rather than at discovery, because a recorded system that changed does not need finding again, it needs re-bounding.</desc>
<rect width="820" height="470" fill="#FFFFFF"/>

<defs>
  <marker id="a303" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3A42"/>
  </marker>
  <marker id="a303l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A9AA3"/>
  </marker>
</defs>

<!-- stage boxes -->
<g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">

  <!-- 1 DISCOVERY -->
  <rect x="40" y="60" width="200" height="96" rx="3" fill="#FFFFFF" stroke="#2B3A42" stroke-width="1.5"/>
  <text x="56" y="84" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8A9AA3">1 · USUAL ENTRY</text>
  <text x="56" y="107" font-size="15" font-weight="600" fill="#1A1A1A">Discovery</text>
  <text x="56" y="127" font-size="12" fill="#2B3A42">What is running that we</text>
  <text x="56" y="143" font-size="12" fill="#2B3A42">have not recorded?</text>

  <!-- 2 BOUNDARY -->
  <rect x="320" y="60" width="200" height="96" rx="3" fill="#FFFFFF" stroke="#2B3A42" stroke-width="1.5"/>
  <text x="336" y="84" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8A9AA3">2 · SECTION 3.2</text>
  <text x="336" y="107" font-size="15" font-weight="600" fill="#1A1A1A">Boundary</text>
  <text x="336" y="127" font-size="12" fill="#2B3A42">What belongs to the</text>
  <text x="336" y="143" font-size="12" fill="#2B3A42">governed system?</text>

  <!-- 3 INVENTORY -->
  <rect x="600" y="60" width="180" height="96" rx="3" fill="#FFFFFF" stroke="#2B3A42" stroke-width="1.5"/>
  <text x="616" y="84" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8A9AA3">3 · SECTION 3.3</text>
  <text x="616" y="107" font-size="15" font-weight="600" fill="#1A1A1A">Inventory</text>
  <text x="616" y="127" font-size="12" fill="#2B3A42">What do we know</text>
  <text x="616" y="143" font-size="12" fill="#2B3A42">about it?</text>

  <!-- 4 CLASSIFICATION -->
  <rect x="600" y="248" width="180" height="96" rx="3" fill="#FFFFFF" stroke="#2B3A42" stroke-width="1.5"/>
  <text x="616" y="272" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8A9AA3">4 · SECTIONS 3.5–3.7</text>
  <text x="616" y="295" font-size="15" font-weight="600" fill="#1A1A1A">Classification</text>
  <text x="616" y="315" font-size="12" fill="#2B3A42">How much attention</text>
  <text x="616" y="331" font-size="12" fill="#2B3A42">does it deserve?</text>

  <!-- change event -->
  <rect x="320" y="248" width="200" height="96" rx="3" fill="#F2F2F2" stroke="#2B3A42" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="336" y="272" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8A9AA3">THE LOOP CLOSES HERE</text>
  <text x="336" y="295" font-size="15" font-weight="600" fill="#1A1A1A">The deployment changes</text>
  <text x="336" y="315" font-size="12" fill="#2B3A42">A capability is added, or a</text>
  <text x="336" y="331" font-size="12" fill="#2B3A42">model is substituted.</text>

  <!-- forward arrows -->
  <line x1="240" y1="108" x2="313" y2="108" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a303)"/>
  <line x1="520" y1="108" x2="593" y2="108" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a303)"/>
  <line x1="690" y1="156" x2="690" y2="241" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a303)"/>
  <line x1="600" y1="296" x2="527" y2="296" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a303)"/>

  <!-- the return: change re-enters at BOUNDARY, not discovery -->
  <line x1="420" y1="248" x2="420" y2="163" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a303)"/>
  <text x="432" y="205" font-size="12" font-weight="600" fill="#1A1A1A">Re-bound, do not rediscover</text>
  <text x="432" y="221" font-size="11" fill="#8A9AA3">a recorded system that changed</text>

  <!-- arrow labels -->
  <text x="248" y="100" font-size="11" fill="#8A9AA3">candidate</text>
  <text x="528" y="100" font-size="11" fill="#8A9AA3">defined unit</text>
  <text x="698" y="205" font-size="11" fill="#8A9AA3">records</text>

  <!-- footer note -->
  <line x1="40" y1="392" x2="780" y2="392" stroke="#BFBFBF" stroke-width="1"/>
  <text x="40" y="416" font-size="12" fill="#2B3A42">Teaching order is 2, 3, 1. Operating order starts at 1, because an organization does not yet know what it has.</text>
  <text x="40" y="436" font-size="12" fill="#2B3A42">The loop has no exit. There is no state in which an organization has finished finding out what it operates.</text>
</g>
</svg>
