<svg viewBox="0 0 900 572" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Root cause analysis to systemic factors">
<!-- FIGURE 10.2 REQUIRED ELEMENTS
Must appear as a process canvas showing four levels connected by "why"
arrows: proximate cause at the top, then the testing-gap question, the
monitoring-gap question, and the process-gap question, each level named
concretely rather than left generic. Must show the proximate cause alone
leading only to a patch, while reaching the fourth level leads to a
process change. Entry condition: the immediate incident response from
10.3 has stabilized the situation. Exit condition: a named systemic
factor with an owner, handed to 10.6's post-incident review. Deliberately
excluded: the post-incident review's ownership and verification tracking
(10.6's job). Must work in black and white.
SOURCE: original; the three-why structure follows root cause analysis
practice from safety-critical systems engineering, applied here to the
AI system lifecycle stages this book has already developed.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Root cause analysis to systemic factors</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="572" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 10.2 &#183; Root cause analysis to systemic factors</text>
<text x="30" y="62" class="col" fill="#46536b">LEVEL</text>
<text x="220" y="62" class="col" fill="#46536b">QUESTION ASKED</text>
<text x="620" y="62" class="col" fill="#46536b">WHAT IT PRODUCES</text>
<line x1="20" y1="76" x2="880" y2="76" stroke="#1a2230" stroke-width="1.6"/>
<rect x="20" y="90" width="860" height="92" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="112" class="bx" font-weight="700" fill="#1a2230">PROXIMATE CAUSE</text>
<text x="32" y="130" class="col" fill="#46536b">LEVEL 1 OF 4</text>
<text x="220" y="114" class="sm" fill="#1a2230">what happened, at the</text>
<text x="220" y="129" class="sm" fill="#1a2230">surface: the model performed</text>
<text x="220" y="144" class="sm" fill="#1a2230">worse at six hospitals</text>
<text x="620" y="114" class="sm" font-weight="700" fill="#1a2230">a patch: retrain the</text>
<text x="620" y="129" class="sm" font-weight="700" fill="#1a2230">model on this population</text>
<line x1="450.0" y1="182.0" x2="450.0" y2="186.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="450.0,194.0 446.0,186.0 454.0,186.0" fill="#1a2230"/>
<text x="465" y="192" class="em" fill="#46536b">why?</text>
<rect x="20" y="196" width="860" height="92" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="218" class="bx" font-weight="700" fill="#1a2230">TESTING GAP</text>
<text x="32" y="236" class="col" fill="#46536b">LEVEL 2 OF 4</text>
<text x="220" y="220" class="sm" fill="#1a2230">was the validation population</text>
<text x="220" y="235" class="sm" fill="#1a2230">representative of every</text>
<text x="220" y="250" class="sm" fill="#1a2230">deployment site (Ch. 7)?</text>
<text x="620" y="220" class="sm" font-weight="700" fill="#1a2230">a validation-practice</text>
<text x="620" y="235" class="sm" font-weight="700" fill="#1a2230">gap, named</text>
<line x1="450.0" y1="288.0" x2="450.0" y2="292.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="450.0,300.0 446.0,292.0 454.0,292.0" fill="#1a2230"/>
<text x="465" y="298" class="em" fill="#46536b">why?</text>
<rect x="20" y="302" width="860" height="92" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="324" class="bx" font-weight="700" fill="#1a2230">MONITORING GAP</text>
<text x="32" y="342" class="col" fill="#46536b">LEVEL 3 OF 4</text>
<text x="220" y="326" class="sm" fill="#1a2230">was every monitoring</text>
<text x="220" y="341" class="sm" fill="#1a2230">dimension actually built,</text>
<text x="220" y="356" class="sm" fill="#1a2230">or only some (Ch. 9)?</text>
<text x="620" y="326" class="sm" font-weight="700" fill="#1a2230">a monitoring-design</text>
<text x="620" y="341" class="sm" font-weight="700" fill="#1a2230">gap, named</text>
<line x1="450.0" y1="394.0" x2="450.0" y2="398.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="450.0,406.0 446.0,398.0 454.0,398.0" fill="#1a2230"/>
<text x="465" y="404" class="em" fill="#46536b">why?</text>
<rect x="20" y="408" width="860" height="92" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="32" y="430" class="bx" font-weight="700" fill="#1a2230">PROCESS GAP</text>
<text x="32" y="448" class="col" fill="#46536b">LEVEL 4 OF 4</text>
<text x="220" y="432" class="sm" fill="#1a2230">did any lifecycle stage own</text>
<text x="220" y="447" class="sm" fill="#1a2230">checking deployment-context</text>
<text x="220" y="462" class="sm" fill="#1a2230">fit at all?</text>
<text x="620" y="432" class="sm" font-weight="700" fill="#8a3324">a process change, owned</text>
<text x="620" y="447" class="sm" font-weight="700" fill="#8a3324">and dated (10.6)</text>
<line x1="20" y1="522" x2="880" y2="522" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="538" class="sm" fill="#46536b">Stopping at level 1 produces a technically accurate finding that leaves the process capable of producing</text>
<text x="20" y="556" class="sm" fill="#46536b">the identical failure in a different system. Only level 4 reaches something a post-incident review can own.</text>
</svg>