<svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0702t fig0702d" aria-label="Evaluation approach by system class, plus a system-level check">
<title id="fig0702t">Evaluation approach by system class, plus a system-level check</title>
<desc id="fig0702d">Three columns, predictive, generative, and agentic, each naming its own evaluation unit, the failure mode it probes for, and what it requires. Below the three columns, a fourth, system-level band covers component interaction, orchestration, human workflow, access and recourse, operational outcomes, monitoring, and downstream effects, with a stated warning that passing every column individually does not by itself establish that the assembled system works. A real deployment can draw from more than one column at once.</desc>
<!-- FIGURE 7.2 REQUIRED ELEMENTS (revised per CH054; REBUILT, applied)
Must appear: three columns (predictive, generative, agentic), each naming
its distinct evaluation unit (single output vs. graded output vs. action
sequence), its distinct failure mode to probe for, and its distinct testing
requirement. A fourth, system-level band below the three columns must
also appear, covering component interaction, orchestration, human workflow,
access and recourse, operational outcomes, monitoring, and downstream
effects, with a visual note that a real deployment can draw from more than
one column at once. Must show these are different disciplines, not one method
applied three times, and must show that passing every column individually
does not by itself establish the combined system works. Entry condition: a
system has passed performance testing (7.1). Exit condition: the
evaluation approach matching the system's class has been applied, not
assumed transferable from another class, AND the system-level band has
been checked for a deployment combining more than one class. Deliberately
excluded: fairness metrics (7.2 owns that content). Must work in black and
white.
SOURCE: original; structure follows this chapter's own sections 7.1, 7.4,
and 7.7.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x].
Rebuilt to add CH054's fourth, system-level band beneath the three
columns, fed by convergence arrows from all three, naming its seven
components and stating explicitly that passing every column individually
does not establish the assembled system works. Checked 13 Sep 2026.
-->
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 7.2 &#183; Evaluation approach by system class, plus a system check</text>
<rect x="30" y="60" width="260" height="40" rx="4" fill="#1a2230"/>
<text x="160.0" y="85" class="cls" fill="#ffffff" text-anchor="middle">PREDICTIVE</text>
<text x="30" y="120" class="col" fill="#46536b">UNIT</text>
<text x="30" y="138" class="sm" fill="#1a2230">a single output, checked against a</text>
<text x="30" y="153" class="sm" fill="#1a2230">known outcome</text>
<text x="30" y="186" class="col" fill="#46536b">PROBE FOR</text>
<text x="30" y="204" class="sm" fill="#1a2230">boundary instability a per-case</text>
<text x="30" y="219" class="sm" fill="#1a2230">accuracy average hides</text>
<text x="30" y="252" class="col" fill="#46536b">REQUIRES</text>
<text x="30" y="270" class="sm" fill="#1a2230">held-out data, error-cost-matched</text>
<text x="30" y="285" class="sm" fill="#1a2230">metric (7.1)</text>
<line x1="305.0" y1="60" x2="305.0" y2="298" stroke="#c9d1dc" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="320" y="60" width="260" height="40" rx="4" fill="#1a2230"/>
<text x="450.0" y="85" class="cls" fill="#ffffff" text-anchor="middle">GENERATIVE</text>
<text x="320" y="120" class="col" fill="#46536b">UNIT</text>
<text x="320" y="138" class="sm" fill="#1a2230">a graded output, checked against a</text>
<text x="320" y="153" class="sm" fill="#1a2230">rubric</text>
<text x="320" y="186" class="col" fill="#46536b">PROBE FOR</text>
<text x="320" y="204" class="sm" fill="#1a2230">rubric ambiguity graders resolve</text>
<text x="320" y="219" class="sm" fill="#1a2230">inconsistently</text>
<text x="320" y="252" class="col" fill="#46536b">REQUIRES</text>
<text x="320" y="270" class="sm" fill="#1a2230">task decomposition, rubric, inter-</text>
<text x="320" y="285" class="sm" fill="#1a2230">rater reliability (7.4)</text>
<line x1="595.0" y1="60" x2="595.0" y2="298" stroke="#c9d1dc" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="610" y="60" width="260" height="40" rx="4" fill="#1a2230"/>
<text x="740.0" y="85" class="cls" fill="#ffffff" text-anchor="middle">AGENTIC</text>
<text x="610" y="120" class="col" fill="#46536b">UNIT</text>
<text x="610" y="138" class="sm" fill="#1a2230">a sequence of actions, checked for</text>
<text x="610" y="153" class="sm" fill="#1a2230">path as well as endpoint</text>
<text x="610" y="186" class="col" fill="#46536b">PROBE FOR</text>
<text x="610" y="204" class="sm" fill="#1a2230">what happens when goal and</text>
<text x="610" y="219" class="sm" fill="#1a2230">constraint cannot both hold</text>
<text x="610" y="252" class="col" fill="#46536b">REQUIRES</text>
<text x="610" y="270" class="sm" fill="#1a2230">realistic reversible sandbox,</text>
<text x="610" y="285" class="sm" fill="#1a2230">action-sequence grading (7.7)</text>
<line x1="20" y1="298" x2="880" y2="298" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="318" class="sm" fill="#46536b">Three different disciplines, not one method applied three times. A system that generates and also acts needs both the middle and right columns.</text>
<line x1="160.0" y1="325" x2="160.0" y2="345" stroke="#1a2230" stroke-width="1.5"/>
<line x1="450.0" y1="325" x2="450.0" y2="345" stroke="#1a2230" stroke-width="1.5"/>
<line x1="740.0" y1="325" x2="740.0" y2="345" stroke="#1a2230" stroke-width="1.5"/>
<line x1="160.0" y1="345" x2="740.0" y2="345" stroke="#1a2230" stroke-width="1.5"/>
<line x1="450.0" y1="345" x2="450.0" y2="353" stroke="#1a2230" stroke-width="1.6"/>
<polygon points="450.0,361 446,353 454,353" fill="#1a2230"/>
<rect x="30" y="375" width="840" height="128" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="450.0" y="397" class="col" fill="#1a2230" text-anchor="middle">FOURTH BAND &#183; SYSTEM-LEVEL CHECK, RUN AFTER ALL THREE COLUMNS</text>
<text x="450.0" y="420" class="bx" fill="#1a2230" text-anchor="middle">component interaction &#183; orchestration &#183; human workflow &#183; access &amp; recourse</text>
<text x="450.0" y="440" class="bx" fill="#1a2230" text-anchor="middle">operational outcomes &#183; monitoring &#183; downstream effects</text>
<line x1="60" y1="454" x2="840" y2="454" stroke="#8794a8" stroke-width="1"/>
<text x="450.0" y="476" class="bx" fill="#1a2230" text-anchor="middle" font-weight="700">Passing every column above, individually, does not establish that the</text>
<text x="450.0" y="494" class="bx" fill="#1a2230" text-anchor="middle" font-weight="700">assembled system works.</text>
<text x="20" y="524" class="sm" fill="#46536b">Most real deployments are not one class but a combination; the column boundaries describe evaluation disciplines, not a claim that a</text>
<text x="20" y="542" class="sm" fill="#46536b">system sits in only one. Exit: the matching column applied per class, AND the fourth band checked for any combination the system carries.</text>
</svg>
