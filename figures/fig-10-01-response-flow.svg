<svg viewBox="0 0 900 392" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Incident response flow with decision points">
<!-- FIGURE 10.1 REQUIRED ELEMENTS
Must appear as a process canvas: the five procedures (notification,
assessment, containment, communication, documentation) running from
detection, with an explicit decision point for severity classification
gating which procedures run on an emergency timeline versus a standard
one. Must show the agentic-specific branch: containment splits into
halting future action and a separate assessment-and-remediation step for
actions already taken. Entry condition: an incident has been detected
through any channel in 10.1. Exit condition: all five procedures complete
and the incident handed to root cause analysis. Deliberately excluded:
the severity criteria themselves (10.2's job) and root cause analysis
(10.5's figure). Must work in black and white.
SOURCE: original; the five-procedure structure is this chapter's own
synthesis of incident response practice from safety-critical and
security incident management, adapted to the agentic containment
obligation this book's coverage rule requires.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Incident response flow with decision points</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="392" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 10.1 &#183; Incident response flow with decision points</text>
<rect x="30" y="58" width="200" height="50" rx="4" fill="#1a2230"/>
<text x="130.0" y="80" class="bx" fill="#ffffff" text-anchor="middle">DETECTION</text>
<text x="130.0" y="97" class="sm" fill="#ffffff" text-anchor="middle">(4 channels, 10.1)</text>
<line x1="230.0" y1="83.0" x2="282.0" y2="83.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="290.0,83.0 282.0,87.0 282.0,79.0" fill="#1a2230"/>
<polygon points="340,53.0 390.0,83 340,113.0 290.0,83" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="340" y="79" class="sm" fill="#1a2230" text-anchor="middle" font-weight="700">SEVERITY</text>
<text x="340" y="94" class="sm" fill="#1a2230" text-anchor="middle" font-weight="700">CLASSIFIED</text>
<line x1="390.0" y1="83.0" x2="422.0" y2="83.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="430.0,83.0 422.0,87.0 422.0,79.0" fill="#1a2230"/>
<text x="440" y="60" class="em" fill="#46536b">emergency tier</text>
<text x="440" y="74" class="em" fill="#46536b">(10.2): immediate,</text>
<text x="440" y="88" class="em" fill="#46536b">named authority</text>
<text x="30" y="150" class="col" fill="#46536b">FIVE PROCEDURES, RUN IN PARALLEL WHERE SEVERITY REQUIRES</text>
<rect x="30" y="164" width="165" height="62" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="40" y="186" class="bx" font-weight="700" fill="#1a2230">NOTIFICATION</text>
<text x="40" y="202" class="sm" fill="#1a2230">alert people the severity</text>
<text x="40" y="216" class="sm" fill="#1a2230">tier specifies</text>
<rect x="203" y="164" width="165" height="62" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.2"/>
<text x="213" y="186" class="bx" font-weight="700" fill="#1a2230">ASSESSMENT</text>
<text x="213" y="202" class="sm" fill="#1a2230">establish scope: how many,</text>
<text x="213" y="216" class="sm" fill="#1a2230">still active or not</text>
<rect x="376" y="164" width="165" height="62" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="386" y="186" class="bx" font-weight="700" fill="#1a2230">CONTAINMENT</text>
<text x="386" y="202" class="sm" fill="#1a2230">stop harm continuing;</text>
<text x="386" y="216" class="sm" fill="#1a2230">see agentic branch below</text>
<rect x="549" y="164" width="165" height="62" rx="4" fill="#ffffff" stroke="#1a2230" stroke-width="1.2"/>
<text x="559" y="186" class="bx" font-weight="700" fill="#1a2230">COMMUNICATION</text>
<text x="559" y="202" class="sm" fill="#1a2230">inform stakeholders at a</text>
<text x="559" y="216" class="sm" fill="#1a2230">proportional cadence</text>
<rect x="722" y="164" width="165" height="62" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="732" y="186" class="bx" font-weight="700" fill="#1a2230">DOCUMENTATION</text>
<text x="732" y="202" class="sm" fill="#1a2230">record decisions in real</text>
<text x="732" y="216" class="sm" fill="#1a2230">time, not reconstructed</text>
<line x1="340.0" y1="113.0" x2="340.0" y2="128.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="340.0,136.0 336.0,128.0 344.0,128.0" fill="#1a2230"/>
<text x="30" y="244" class="col" fill="#8a3324">AGENTIC CONTAINMENT SPLITS IN TWO</text>
<rect x="30" y="252" width="250" height="66" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="40" y="274" class="bx" font-weight="700" fill="#1a2230">HALT THE AGENT</text>
<text x="40" y="292" class="sm" fill="#1a2230">stops future actions</text>
<text x="40" y="307" class="sm" fill="#1a2230">immediately</text>
<rect x="320" y="252" width="250" height="66" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="330" y="274" class="bx" font-weight="700" fill="#1a2230">ASSESS AND REMEDIATE</text>
<text x="330" y="292" class="sm" fill="#1a2230">actions already taken;</text>
<text x="330" y="307" class="sm" fill="#1a2230">reverse what can be undone</text>
<line x1="280.0" y1="285.0" x2="312.0" y2="285.0" stroke="#8a3324" stroke-width="1.8"/><polygon points="320.0,285.0 312.0,289.0 312.0,281.0" fill="#8a3324"/>
<line x1="458.5" y1="226.0" x2="458.5" y2="238.0" stroke="#8a3324" stroke-width="1.8"/><polygon points="458.5,246.0 454.5,238.0 462.5,238.0" fill="#8a3324"/>
<line x1="20" y1="334" x2="880" y2="334" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="352" class="sm" fill="#46536b">Containment is not complete for an agentic incident until the second box is done, not merely the first.</text>
<text x="20" y="370" class="sm" fill="#46536b">All five procedures feed root cause analysis (Figure 10.2) once the immediate situation is stable.</text>
</svg>