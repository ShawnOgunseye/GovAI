<svg viewBox="0 0 900 458" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three operating models compared">
<!-- FIGURE 13.1 REQUIRED ELEMENTS
Must appear as a comparison canvas: centralized, federated, and hybrid
operating models, each with what it does well and where it fails, so a
reader can compare tradeoffs rather than read three isolated
descriptions. Entry condition: an organization is designing its AI
governance operating model. Exit condition: a model selected against
named organizational conditions (scale, maturity, deployment velocity).
Deliberately excluded: the layer-split detail of the hybrid model (13.3
and Figure 13.2 own that). Must work in black and white.
SOURCE: original; the three models are standard organizational-design
categories applied here to this chapter's own AI governance argument.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Three operating models compared</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="458" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 13.1 &#183; Three operating models compared</text>
<rect x="20" y="58" width="270" height="40" rx="4" fill="#1a2230"/>
<text x="155.0" y="84" class="cls" fill="#ffffff" text-anchor="middle" font-size="12.5">CENTRALIZED</text>
<rect x="310" y="58" width="270" height="40" rx="4" fill="#1a2230"/>
<text x="445.0" y="84" class="cls" fill="#ffffff" text-anchor="middle" font-size="12.5">FEDERATED</text>
<rect x="600" y="58" width="270" height="40" rx="4" fill="#1a2230"/>
<text x="735.0" y="84" class="cls" fill="#ffffff" text-anchor="middle" font-size="12.5">HYBRID (LAYER SPLIT)</text>
<rect x="20" y="118" width="270" height="128" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="140" class="bx" font-weight="700" fill="#1a2230">STRENGTH</text>
<text x="32" y="160" class="sm" fill="#1a2230">single point of aggregate</text>
<text x="32" y="176" class="sm" fill="#1a2230">visibility; consistent</text>
<text x="32" y="192" class="sm" fill="#1a2230">standards across the</text>
<text x="32" y="208" class="sm" fill="#1a2230">organization (13.1)</text>
<rect x="310" y="118" width="270" height="128" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="322" y="140" class="bx" font-weight="700" fill="#1a2230">STRENGTH</text>
<text x="322" y="160" class="sm" fill="#1a2230">responsive to local context;</text>
<text x="322" y="176" class="sm" fill="#1a2230">judgment fits the business</text>
<text x="322" y="192" class="sm" fill="#1a2230">unit's own deployment</text>
<text x="322" y="208" class="sm" fill="#1a2230">conditions (13.1)</text>
<rect x="600" y="118" width="270" height="128" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="612" y="140" class="bx" font-weight="700" fill="#1a2230">STRENGTH</text>
<text x="612" y="160" class="sm" fill="#1a2230">matches authority to where</text>
<text x="612" y="176" class="sm" fill="#1a2230">a defect originates: system</text>
<text x="612" y="192" class="sm" fill="#1a2230">layer local, model layer</text>
<text x="612" y="208" class="sm" fill="#1a2230">central (13.3)</text>
<rect x="20" y="266" width="270" height="128" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="32" y="288" class="bx" font-weight="700" fill="#8a3324">FAILS</text>
<text x="32" y="308" class="sm" fill="#1a2230">becomes a bottleneck once</text>
<text x="32" y="324" class="sm" fill="#1a2230">deployment volume outpaces</text>
<text x="32" y="340" class="sm" fill="#1a2230">one central team's review</text>
<text x="32" y="356" class="sm" fill="#1a2230">capacity (13.1)</text>
<rect x="310" y="266" width="270" height="128" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="322" y="288" class="bx" font-weight="700" fill="#8a3324">FAILS</text>
<text x="322" y="308" class="sm" fill="#1a2230">classification drift, capture</text>
<text x="322" y="324" class="sm" fill="#1a2230">by the business served, lost</text>
<text x="322" y="340" class="sm" fill="#1a2230">aggregate visibility across</text>
<text x="322" y="356" class="sm" fill="#1a2230">the organization (13.4)</text>
<rect x="600" y="266" width="270" height="128" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="612" y="288" class="bx" font-weight="700" fill="#8a3324">FAILS</text>
<text x="612" y="308" class="sm" fill="#1a2230">requires deliberate design;</text>
<text x="612" y="324" class="sm" fill="#1a2230">an accidental, unchosen split</text>
<text x="612" y="340" class="sm" fill="#1a2230">leaves gaps neither layer</text>
<text x="612" y="356" class="sm" fill="#1a2230">actually owns (13.2)</text>
<line x1="20" y1="406" x2="880" y2="406" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="424" class="sm" fill="#46536b">Every model carries a predictable weakness; the choice is which weakness an organization can tolerate</text>
<text x="20" y="442" class="sm" fill="#46536b">given its own scale, existing risk maturity, and deployment velocity, not a search for a model with none.</text>
</svg>