<svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- FIGURE 8.1 REQUIRED ELEMENTS (revised per CH059)
Must appear: three distinct gates, not two. These are system readiness
(technical, performance, compliance), organizational readiness (operational,
oversight, monitoring, incident, presented as a minimum list per CH060),
and context alignment (use case, population, environment, risk
proportionality). These appear as three separate columns or gates, none
nested inside another. Must show that passing system readiness does not
imply either of the other two is even assessed, let alone passed, and that
a release decision requires evidence from all three, not two. No encoded
em dashes in any header label. Entry condition: a system has completed
Chapter 7 testing. Exit condition: all three dimensions evaluated, with a
named gap where any one is incomplete. Deliberately excluded: the
deployment decision itself (8.4's job). Must work in black and white
(gates carry numbered labels, not color alone).
SOURCE: original; the three-dimension split is this book's own
structuring, motivated by the recurring deployment failure pattern this
chapter documents.
AUDIT: redrawn to match sections 8.1-8.3 text, rendered and viewed
-->
<title id="t">Figure 8.1. Readiness across three dimensions</title>
<desc id="d">Three separate gates stand side by side. Gate 1, system readiness, has three checks: technical, performance, and compliance. Gate 2, organizational readiness, has four checks presented as a minimum list: operational, oversight, monitoring, and incident. Gate 3, context alignment, has four checks: use case, population, environment, and risk proportionality. A system enters after completing Chapter 7 testing. Passing Gate 1 says nothing about the other two gates. The review exits only when all three gates are evaluated, with a named gap recorded where any one is incomplete. The deployment decision itself comes later, in section 8.4.</desc>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.col{font-size:11px;font-weight:700;letter-spacing:.05em;}
.gnum{font-size:11px;font-weight:400;letter-spacing:.12em;}
.hd{font-size:11.5px;font-weight:700;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
<text x="20" y="32" class="ttl" fill="#1a2230">Figure 8.1 &#183; Readiness across three dimensions</text>

<!-- entry band -->
<rect x="20" y="50" width="860" height="28" fill="#eef1f5" stroke="#c9d1dc" stroke-width="1"/>
<text x="450" y="69" class="col" fill="#1a2230" text-anchor="middle">ENTRY: A SYSTEM HAS COMPLETED CHAPTER 7 TESTING</text>
<line x1="156" y1="78" x2="156" y2="96" stroke="#46536b" stroke-width="1.4"/>
<polygon points="151,94 161,94 156,102" fill="#46536b"/>
<line x1="450" y1="78" x2="450" y2="96" stroke="#46536b" stroke-width="1.4"/>
<polygon points="445,94 455,94 450,102" fill="#46536b"/>
<line x1="744" y1="78" x2="744" y2="96" stroke="#46536b" stroke-width="1.4"/>
<polygon points="739,94 749,94 744,102" fill="#46536b"/>

<!-- gate headers -->
<rect x="20" y="104" width="272" height="42" fill="#1a2230"/>
<text x="156" y="121" class="gnum" fill="#ffffff" text-anchor="middle">GATE 1</text>
<text x="156" y="138" class="col" fill="#ffffff" text-anchor="middle">SYSTEM READINESS</text>
<rect x="314" y="104" width="272" height="42" fill="#8a3324"/>
<text x="450" y="121" class="gnum" fill="#ffffff" text-anchor="middle">GATE 2</text>
<text x="450" y="138" class="col" fill="#ffffff" text-anchor="middle">ORGANIZATIONAL READINESS</text>
<rect x="608" y="104" width="272" height="42" fill="#46536b"/>
<text x="744" y="121" class="gnum" fill="#ffffff" text-anchor="middle">GATE 3</text>
<text x="744" y="138" class="col" fill="#ffffff" text-anchor="middle">CONTEXT ALIGNMENT</text>

<!-- gate subcaptions -->
<text x="156" y="163" class="em" fill="#46536b" text-anchor="middle">Usually checked well. It</text>
<text x="156" y="177" class="em" fill="#46536b" text-anchor="middle">produces clean numbers.</text>
<text x="450" y="163" class="em" fill="#46536b" text-anchor="middle">Evidence is records and</text>
<text x="450" y="177" class="em" fill="#46536b" text-anchor="middle">observation, not one score.</text>
<text x="744" y="163" class="em" fill="#46536b" text-anchor="middle">Its own gate, not a detail</text>
<text x="744" y="177" class="em" fill="#46536b" text-anchor="middle">folded into the other two.</text>

<!-- gate 1 boxes -->
<rect x="20" y="188" width="272" height="56" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="207" class="hd" fill="#1a2230">TECHNICAL</text>
<text x="32" y="223" class="sm" fill="#1a2230">works correctly with the systems it</text>
<text x="32" y="237" class="sm" fill="#1a2230">will run inside</text>
<rect x="20" y="254" width="272" height="56" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="273" class="hd" fill="#1a2230">PERFORMANCE</text>
<text x="32" y="289" class="sm" fill="#1a2230">Chapter 7 results: accuracy, fairness,</text>
<text x="32" y="303" class="sm" fill="#1a2230">robustness, sentinel checks</text>
<rect x="20" y="320" width="272" height="56" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="32" y="339" class="hd" fill="#1a2230">COMPLIANCE</text>
<text x="32" y="355" class="sm" fill="#1a2230">paperwork checked as complete:</text>
<text x="32" y="369" class="sm" fill="#1a2230">documentation, approvals, disclosures</text>
<text x="32" y="398" class="em" fill="#8a3324">Passing this gate says nothing about</text>
<text x="32" y="412" class="em" fill="#8a3324">Gates 2 and 3. It does not even show</text>
<text x="32" y="426" class="em" fill="#8a3324">that they were assessed.</text>

<!-- gate 2 boxes -->
<rect x="314" y="188" width="272" height="56" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="326" y="207" class="hd" fill="#1a2230">OPERATIONAL</text>
<text x="326" y="223" class="sm" fill="#1a2230">staff trained on what it does, does not</text>
<text x="326" y="237" class="sm" fill="#1a2230">do, and when to override</text>
<rect x="314" y="254" width="272" height="56" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="326" y="273" class="hd" fill="#1a2230">OVERSIGHT</text>
<text x="326" y="289" class="sm" fill="#1a2230">a reviewer with the time, authority, and</text>
<text x="326" y="303" class="sm" fill="#1a2230">information to catch a wrong output</text>
<rect x="314" y="320" width="272" height="56" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="326" y="339" class="hd" fill="#1a2230">MONITORING</text>
<text x="326" y="355" class="sm" fill="#1a2230">someone watching a defined measure,</text>
<text x="326" y="369" class="sm" fill="#1a2230">with a threshold that triggers action</text>
<rect x="314" y="386" width="272" height="56" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="326" y="405" class="hd" fill="#1a2230">INCIDENT</text>
<text x="326" y="421" class="sm" fill="#1a2230">a response plan built before an incident,</text>
<text x="326" y="435" class="sm" fill="#1a2230">not improvised during one</text>
<text x="326" y="460" class="em" fill="#8a3324">These four are a minimum, not the</text>
<text x="326" y="474" class="em" fill="#8a3324">whole list.</text>

<!-- gate 3 boxes -->
<rect x="608" y="188" width="272" height="56" rx="4" fill="#eef1f5" stroke="#46536b" stroke-width="1.4"/>
<text x="620" y="207" class="hd" fill="#1a2230">USE CASE</text>
<text x="620" y="223" class="sm" fill="#1a2230">the same task it was validated on, not a</text>
<text x="620" y="237" class="sm" fill="#1a2230">plausible extension of it</text>
<rect x="608" y="254" width="272" height="56" rx="4" fill="#eef1f5" stroke="#46536b" stroke-width="1.4"/>
<text x="620" y="273" class="hd" fill="#1a2230">POPULATION</text>
<text x="620" y="289" class="sm" fill="#1a2230">the people it will serve match the</text>
<text x="620" y="303" class="sm" fill="#1a2230">people it was tested on</text>
<rect x="608" y="320" width="272" height="56" rx="4" fill="#eef1f5" stroke="#46536b" stroke-width="1.4"/>
<text x="620" y="339" class="hd" fill="#1a2230">ENVIRONMENT</text>
<text x="620" y="355" class="sm" fill="#1a2230">equipment, staffing, documentation,</text>
<text x="620" y="369" class="sm" fill="#1a2230">and IT match what it was tested against</text>
<rect x="608" y="386" width="272" height="56" rx="4" fill="#eef1f5" stroke="#46536b" stroke-width="1.4"/>
<text x="620" y="405" class="hd" fill="#1a2230">RISK PROPORTIONALITY</text>
<text x="620" y="421" class="sm" fill="#1a2230">the stakes of this deployment match the</text>
<text x="620" y="435" class="sm" fill="#1a2230">scrutiny the system received</text>

<!-- arrows to exit -->
<line x1="156" y1="434" x2="156" y2="484" stroke="#46536b" stroke-width="1.4"/>
<polygon points="151,482 161,482 156,490" fill="#46536b"/>
<line x1="450" y1="480" x2="450" y2="484" stroke="#46536b" stroke-width="1.4"/>
<polygon points="445,482 455,482 450,490" fill="#46536b"/>
<line x1="744" y1="450" x2="744" y2="484" stroke="#46536b" stroke-width="1.4"/>
<polygon points="739,482 749,482 744,490" fill="#46536b"/>

<!-- exit band -->
<rect x="20" y="492" width="860" height="46" fill="#ffffff" stroke="#1a2230" stroke-width="1.4"/>
<text x="450" y="511" class="col" fill="#1a2230" text-anchor="middle">EXIT: ALL THREE GATES EVALUATED, WITH A NAMED GAP RECORDED WHERE ANY ONE IS INCOMPLETE</text>
<text x="450" y="529" class="sm" fill="#46536b" text-anchor="middle">A release decision needs evidence from all three gates, not two. The decision itself comes later, in section 8.4.</text>
</svg>