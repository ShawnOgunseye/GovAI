<text x="580" y="82" font-size="14" font-weight="600" fill="#2B3A42">EU AI Act, high risk</text>
<text x="580" y="104" font-size="12" fill="#2B3A42">Risk management, data governance,</text>
<text x="580" y="122" font-size="12" fill="#2B3A42">technical file, oversight, registration.</text>

<rect x="566" y="182" width="286" height="80" rx="4" fill="#FFFFFF" stroke="#2B3A42" stroke-width="2"/>
<text x="580" y="208" font-size="14" font-weight="600" fill="#2B3A42">Local bias audit requirement</text>
<text x="580" y="230" font-size="12" fill="#2B3A42">Independent annual audit, published,</text>
<text x="580" y="248" font-size="12" fill="#2B3A42">candidate notice before use.</text>

<rect x="566" y="308" width="286" height="80" rx="4" fill="#FFFFFF" stroke="#2B3A42" stroke-width="2"/>
<text x="580" y="334" font-size="14" font-weight="600" fill="#2B3A42">GDPR Article 22</text>
<text x="580" y="356" font-size="12" fill="#2B3A42">Meaningful human involvement, or an</text>
