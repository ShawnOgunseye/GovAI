<!-- REQUIRED ELEMENTS
  One internal classification, performed once, shown as a single source node.
  The four classification factors named on that node.
  At least three distinct regulations as destinations.
  What each regulation demands, not just the regulation name.
  Mapping arrows labelled as rules, not as assessments.
  Entry: the system enters classification. Exit: obligations attach.
  A visible statement that a regulation change edits the rule, not the classification.
  EXCLUDED: the internal governance tier (high/medium/low) is shown but its
  downstream internal process is not. That is Chapter 17.
  SOURCE: original. No published framework expresses this structure; it is the
  book's own argument, developed in section 3.6 and revisited in Chapter 18.
  AUDIT: pass 1 [ ]  pass 2 blind [ ]
  PASS 16 CH REVIEW (2026-09-13, not yet actioned): rendered checker found
  six overlaps/collisions, the worst of the seven Part I figures. The single
  internal-classification-node-to-regulation-arrow topology also needs to become
  independent per-regulation trigger cards fed by a shared regulation-neutral fact
  record, each card showing instrument/version, trigger test, applicability
  result, and a next-check date, plus a feedback path for a system-fact
  change, matching Chapter 3 section 3.7's prose as corrected this pass
  (CH397) and Chapter 18 Figure 18.1's already-revised card architecture.
  Tracked at task #37; not redrawn this pass.
-->

<title id="f0302t">One classification mapped to several regulations</title>
<desc id="f0302d">On the left, a single classification node listing the four factors: consequence, autonomy, population, reversibility. An arrow enters it from a system record. Three labelled mapping rules run from the classification to three regulation boxes on the right: the EU AI Act high-risk obligations, a jurisdiction-specific bias audit requirement, and GDPR Article 22 safeguards. Each regulation box states what it demands. A note at the foot records that when a regulation changes, the mapping rule is edited and the classification is untouched.</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3A42"/></marker>
</defs>
<g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">

