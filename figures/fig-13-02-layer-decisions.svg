<svg viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Operating model decisions by layer">
<!-- FIGURE 13.2 REQUIRED ELEMENTS
Must appear: a matrix or two-column layout showing specific governance
decisions (inventory location, classification authority, deployment
approval, model selection authority, vendor relationship ownership) each
assigned to the system layer or the model layer, demonstrating the
federated-at-system, centralized-at-model pattern from section 13.3
concretely rather than as an abstract principle. Entry condition: an
organization has decided to split authority by layer. Exit condition:
every listed decision has a named layer and owner. Deliberately excluded:
the three operating models themselves (Figure 13.1's job). Must work in
black and white.
SOURCE: original; the layer split is this book's own synthesis, following
directly from the two-record inventory established in Chapter 3.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Operating model decisions by layer</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 13.2 &#183; Operating model decisions by layer</text>
<text x="30" y="62" class="col" fill="#46536b">DECISION</text>
<text x="490" y="62" class="col" fill="#46536b">LAYER</text>
<text x="610" y="62" class="col" fill="#46536b">WHY</text>
<line x1="20" y1="76" x2="880" y2="76" stroke="#1a2230" stroke-width="1.6"/>
<rect x="20" y="90" width="860" height="64" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="32" y="112" class="bx" font-weight="700" fill="#1a2230">System inventory location</text>
<rect x="490" y="104" width="84" height="26" rx="3" fill="#46536b"/>
<text x="532.0" y="121" class="sm" font-weight="700" fill="#ffffff" text-anchor="middle">SYSTEM</text>
<text x="610" y="112" class="sm" fill="#46536b">each deployment's use case and</text>
<text x="610" y="128" class="sm" fill="#46536b">context is local knowledge (13.2)</text>
<rect x="20" y="164" width="860" height="64" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="32" y="186" class="bx" font-weight="700" fill="#1a2230">Risk classification authority</text>
<rect x="490" y="178" width="84" height="26" rx="3" fill="#46536b"/>
<text x="532.0" y="195" class="sm" font-weight="700" fill="#ffffff" text-anchor="middle">SYSTEM</text>
<text x="610" y="186" class="sm" fill="#46536b">depends on the deployment context</text>
<text x="610" y="202" class="sm" fill="#46536b">only the local team fully has (13.2)</text>
<rect x="20" y="238" width="860" height="64" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="32" y="260" class="bx" font-weight="700" fill="#1a2230">Deployment approval</text>
<rect x="490" y="252" width="84" height="26" rx="3" fill="#46536b"/>
<text x="532.0" y="269" class="sm" font-weight="700" fill="#ffffff" text-anchor="middle">SYSTEM</text>
<text x="610" y="260" class="sm" fill="#46536b">Chapter 8 readiness evidence is</text>
<text x="610" y="276" class="sm" fill="#46536b">specific to one deployment (13.3)</text>
<rect x="20" y="312" width="860" height="64" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="32" y="334" class="bx" font-weight="700" fill="#1a2230">Model selection authority</text>
<rect x="490" y="326" width="84" height="26" rx="3" fill="#1a2230"/>
<text x="532.0" y="343" class="sm" font-weight="700" fill="#ffffff" text-anchor="middle">MODEL</text>
<text x="610" y="334" class="sm" fill="#46536b">a flaw here recurs in every local</text>
<text x="610" y="350" class="sm" fill="#46536b">deployment built on it (13.3)</text>
<rect x="20" y="386" width="860" height="64" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.2"/>
<text x="32" y="408" class="bx" font-weight="700" fill="#1a2230">Vendor relationship ownership</text>
<rect x="490" y="400" width="84" height="26" rx="3" fill="#1a2230"/>
<text x="532.0" y="417" class="sm" font-weight="700" fill="#ffffff" text-anchor="middle">MODEL</text>
<text x="610" y="408" class="sm" fill="#46536b">supply chain obligations (Ch. 6) attach</text>
<text x="610" y="424" class="sm" fill="#46536b">to the model, not each use case (13.3)</text>
<line x1="20" y1="468" x2="880" y2="468" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="486" class="sm" fill="#46536b">SYSTEM-layer decisions sit with the local team closest to the deployment; MODEL-layer decisions sit centrally,</text>
<text x="20" y="504" class="sm" fill="#46536b">where a single fix or vetting decision propagates to every deployment resting on the same underlying model.</text>
</svg>