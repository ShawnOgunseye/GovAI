<svg viewBox="0 0 900 492" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Authority chain from principal to acting agent">
<!-- FIGURE 15.3 REQUIRED ELEMENTS
Must appear: a sequence showing a human principal delegating to a
supervising agent, which delegates to a subordinate acting agent, with
each hop recording the registered identity involved and the permission
scope in force at that hop, and the acting agent's final action tagged
with the scope in force at the moment of the action rather than at
registration. Must make legible that a missing record at any hop breaks
the chain at that point. Entry condition: an agent has been registered
under Chapter 12 and delegation is possible. Exit condition: every hop
from principal to acting agent is attributable. Deliberately excluded:
runtime intervention mechanics (Chapter 12's job, not this chapter's).
Must work in black and white.
SOURCE: original; the chain structure is this chapter's own synthesis of
section 15.5's argument, following directly from Chapter 12's
registration requirement and Chapter 9's monitoring dependency.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Authority chain from principal to acting agent</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="492" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 15.3 &#183; Authority chain from principal to acting agent</text>
<rect x="30" y="58" width="560" height="96" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="82" class="bx" font-weight="700" fill="#1a2230">HUMAN PRINCIPAL</text>
<text x="42" y="102" class="sm" fill="#46536b">grants initial permission scope</text>
<text x="42" y="118" class="sm" fill="#46536b">for a scheduling and communication task</text>
<rect x="630" y="58" width="250" height="96" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="642" y="80" class="sm" font-weight="700" fill="#46536b">LOGGED:</text>
<text x="642" y="96" class="sm" font-weight="400" fill="#46536b">principal identity;</text>
<text x="642" y="112" class="sm" font-weight="400" fill="#46536b">scope granted</text>
<rect x="30" y="188" width="560" height="96" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="212" class="bx" font-weight="700" fill="#1a2230">SUPERVISING AGENT (registered)</text>
<text x="42" y="232" class="sm" fill="#46536b">delegates a subtask to a subordinate</text>
<text x="42" y="248" class="sm" fill="#46536b">agent within its own granted scope</text>
<rect x="630" y="188" width="250" height="96" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="642" y="210" class="sm" font-weight="700" fill="#46536b">LOGGED:</text>
<text x="642" y="226" class="sm" font-weight="400" fill="#46536b">delegating identity;</text>
<text x="642" y="242" class="sm" font-weight="400" fill="#46536b">scope passed down</text>
<rect x="30" y="318" width="560" height="96" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="342" class="bx" font-weight="700" fill="#1a2230">ACTING AGENT (registered, subordinate)</text>
<text x="42" y="362" class="sm" fill="#46536b">takes the action under the scope in force</text>
<text x="42" y="378" class="sm" fill="#46536b">at this moment, not at registration</text>
<rect x="630" y="318" width="250" height="96" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="642" y="340" class="sm" font-weight="700" fill="#46536b">LOGGED:</text>
<text x="642" y="356" class="sm" font-weight="400" fill="#46536b">acting identity;</text>
<text x="642" y="372" class="sm" font-weight="400" fill="#46536b">scope in force now</text>
<line x1="310.0" y1="154.0" x2="310.0" y2="180.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="310.0,188.0 306.0,180.0 314.0,180.0" fill="#1a2230"/>
<line x1="310.0" y1="284.0" x2="310.0" y2="310.0" stroke="#1a2230" stroke-width="1.8"/><polygon points="310.0,318.0 306.0,310.0 314.0,310.0" fill="#1a2230"/>
<rect x="30" y="318" width="560" height="96" rx="4" fill="none" stroke="#8a3324" stroke-width="2"/>
<line x1="20" y1="442" x2="880" y2="442" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="458" class="sm" fill="#46536b">The chain's strength is set by its least-recorded hop: a missing log at the supervising agent's delegation</text>
<text x="20" y="476" class="sm" fill="#46536b">step breaks the chain there even if the principal and the acting agent are both fully recorded.</text>
</svg>