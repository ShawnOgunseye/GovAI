  The stop path must show that the reason is recorded, not just that it stopped.
  EXCLUDED: the intake questions themselves. Prose carries them.
  SOURCE: original.
  AUDIT: pass 1 [x] · pass 2 blind [x] · rendered and viewed [x]
  PASS 16 CH REVIEW (2026-09-13, not yet actioned): no mechanical collision
  found, but three flat outcomes omit real process states (return for
