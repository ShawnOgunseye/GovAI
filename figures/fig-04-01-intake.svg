<line x1="20" y1="380" x2="940" y2="380" stroke="#BFBFBF" stroke-width="1"/>
<text x="20" y="404" font-size="13" fill="#2B3A42">The fork on the right determines the work at every stage that follows.</text>
<text x="20" y="424" font-size="13" fill="#2B3A42">Settling it by default is how a system reaches monitoring with no access rights.</text>
