<title id="f0401t">Intake and its three outcomes</title>
<desc id="f0401d">A proposal enters intake, where it is assessed for problem, cause, affected parties and appropriateness. Three outcomes follow. It may stop, with the reason recorded so a later resubmission is assessed rather than relitigated. It may proceed with conditions that are recorded and checked later. Or it may proceed, at which point the build or buy fork determines the work at every subsequent stage.</desc>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2B3A42"/></marker></defs>
<g font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

