<text x="528" y="298" font-size="14" font-weight="600" text-anchor="middle" fill="#2B3A42">proceed</text>

<line x1="634" y1="297" x2="672" y2="297" stroke="#2B3A42" stroke-width="2" marker-end="url(#a4)"/>
