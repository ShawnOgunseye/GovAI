<svg viewBox="0 0 830 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0301t f0301d">
<!-- REQUIRED ELEMENTS
  Layers: model, system, use case. All three, visibly nested.
  Each layer: name, cadence, owner.
  Boundary: use case encloses system encloses model.
  Relation: one model serves several systems.
  Entry: model selected or trained. Exit: model deprecated.
  Entry/exit sit on the MODEL layer only, since that is the layer that swaps.
  System contents named: retrieval, tools, interface, guardrails, human steps.
  EXCLUDED: infrastructure layer. Out of scope for this book, stated in prose.
  SOURCE: original. Diverges from NIST AI RMF and ISO/IEC 22989 lifecycles,
  which treat the AI system as one lifecycle and do not separate the model
  layer from the system layer. Divergence explained in section 3.1 prose.
  AUDIT: pass 1 [ ]  pass 2 blind [ ]
  PASS 16 CH REVIEW (2026-09-13, not yet actioned): rendered checker found
  three box-edge collisions. Nested-box topology also contradicts the
  chapter's own many-to-many claim (one model can serve several systems);
  needs linked versioned records rather than strict nesting, with change,
  validation, rollback, and retirement events shown. Chapter 3 section 3.1's
  prose was separately corrected this pass (CH390) to state owners and
  cadences as a proposed model rather than fact; this figure has not been
  redrawn to match. Tracked at task #37; not redrawn this pass.
  PASS 50 CH REVIEW (2026-09-13, CH392, partial fix applied): the model
  layer's owner label named "an external developer" as an owner, which
  contradicted section 3.1's prose (the developer is a dependency to be
  tracked, not the internal owner; where the organization did not build
  the model, the text names an internal owner responsible for the
  dependency). Owner label and description text corrected to match. The
  underlying topology defect logged above (concentric nesting versus the
  chapter's many-to-many relationship) is unchanged and remains open at
  task #37.
-->

<title id="f0301t">Three nested lifecycle layers</title>
<desc id="f0301d">Three concentric rounded rectangles. The outermost is the use case layer, owned by the business, with a cadence of years. Inside it is the system layer, owned by product and engineering, with a cadence of quarters, containing retrieval, tools, interface, guardrails and human review steps. Innermost is the model layer, owned by data science or by a named internal owner of the dependency, with a cadence of months. Arrows enter and leave the model layer only, marked selected or trained on entry and deprecated on exit. A note at the foot records that one model may serve several systems.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#2B3A42"/></marker>
<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
</defs>
<g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">

<rect x="40" y="40" width="520" height="600" rx="10" fill="#F2F2F2" stroke="#2B3A42" stroke-width="2"/>
<text x="64" y="76" font-size="17" font-weight="600" fill="#2B3A42">Use case layer</text>
<text x="64" y="98" font-size="14" fill="#2B3A42">Screening applicants. Detecting fraud. Predicting deterioration.</text>
<text x="64" y="120" font-size="12" fill="#2B3A42">Cadence: years   ·   Owner: the business</text>

<rect x="80" y="150" width="440" height="450" rx="10" fill="#FFFFFF" stroke="#2B3A42" stroke-width="2"/>
<text x="104" y="186" font-size="17" font-weight="600" fill="#2B3A42">System layer</text>
<text x="104" y="208" font-size="14" fill="#2B3A42">Scope, design, integrate, deploy, operate, retire.</text>
<text x="104" y="230" font-size="12" fill="#2B3A42">Cadence: quarters   ·   Owner: product and engineering</text>

<g font-size="12" fill="#2B3A42">
<rect x="104" y="248" width="90" height="26" rx="6" fill="#BFBFBF" stroke="#2B3A42" stroke-width="1"/><text x="149" y="265" text-anchor="middle">retrieval</text>
<rect x="202" y="248" width="72" height="26" rx="6" fill="#BFBFBF" stroke="#2B3A42" stroke-width="1"/><text x="238" y="265" text-anchor="middle">tools</text>
<rect x="282" y="248" width="84" height="26" rx="6" fill="#BFBFBF" stroke="#2B3A42" stroke-width="1"/><text x="324" y="265" text-anchor="middle">interface</text>
<rect x="374" y="248" width="92" height="26" rx="6" fill="#BFBFBF" stroke="#2B3A42" stroke-width="1"/><text x="420" y="265" text-anchor="middle">guardrails</text>
<rect x="104" y="282" width="146" height="26" rx="6" fill="#BFBFBF" stroke="#2B3A42" stroke-width="1"/><text x="177" y="299" text-anchor="middle">human review steps</text>
</g>

<rect x="128" y="360" width="344" height="196" rx="10" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="152" y="396" font-size="17" font-weight="600" fill="#1A1A1A">Model layer</text>
<text x="152" y="418" font-size="14" fill="#2B3A42">Train or select, validate, version, retrain.</text>
<text x="152" y="440" font-size="12" fill="#2B3A42">Cadence: months, or the developer's schedule</text>
<text x="152" y="458" font-size="12" fill="#2B3A42">Owner: data science, or a named internal owner</text>
<rect x="152" y="478" width="296" height="1" fill="#BFBFBF"/>
<text x="152" y="502" font-size="12" fill="#1A1A1A">A model may be replaced without the system layer</text>
<text x="152" y="520" font-size="12" fill="#1A1A1A">or the use case layer changing at all.</text>


<line x1="474" y1="458" x2="566" y2="458" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="572" cy="458" r="4" fill="#1A1A1A"/>
<text x="586" y="440" font-size="12" fill="#1A1A1A">enters here: selected or trained</text>
<text x="586" y="462" font-size="12" fill="#1A1A1A">exits here: deprecated</text>
<text x="586" y="492" font-size="11.5" fill="#1A1A1A">The layers around it do not</text>
<text x="586" y="510" font-size="11.5" fill="#1A1A1A">change when this happens.</text>

<line x1="415" y1="660" x2="415" y2="690" stroke="#2B3A42" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="415" y="712" font-size="14" text-anchor="middle" fill="#2B3A42">One model may serve several systems.</text>
<text x="415" y="734" font-size="14" text-anchor="middle" fill="#2B3A42">A defect in it is a defect in all of them.</text>
</g>
</svg>
