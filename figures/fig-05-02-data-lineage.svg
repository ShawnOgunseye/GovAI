<svg viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0502t fig0502d" aria-label="A data lineage record, from need to disposition">
<title id="fig0502t">A data lineage record, from need to disposition</title>
<desc id="fig0502d">A nine-stage process, read left to right then right to left: purpose and owner defined; authority established before collection; collection or receipt; quality testing; transformation or labelling; reassessment; approval binding the dataset version to a model or corpus version; monitoring; and disposition. Monitoring and disposition each feed dashed lines back to earlier stages: disposition reassesses purpose, owner, and authority, and monitoring rechecks quality testing and triggers re-approval. The process enters when a data need is identified and exits when the record is closed, whether by correction, retirement, retention, or deletion.</desc>
<!-- FIGURE 5.2 REQUIRED ELEMENTS, REBUILT per CH026.
CH026 finding: the prior five-stage figure checked authority after
collection and transformation, misteaching the order GDPR Articles 5 and 6
require, and omitted nine of the lifecycle's real stages.
Must appear, in order: (1) purpose, affected population, accountable owner,
and decision defined; (2) legal/ethical/contractual authority established,
with source restrictions and minimization recorded, BEFORE collection;
(3) collection or receipt with provenance, sensitivity classification, and
access controls; (4) quality testing against section 5.3's dimensions plus
representativeness and fitness for use; (5) transformation or labelling
under version control preserving lineage; (6) reassessment of purpose,
authority, and permission before each materially changed use; (7) approval
binding the dataset version to the model or corpus version; (8) monitoring
of quality, drift, access, complaints, and downstream effects; (9)
correction, revocation, quarantine, retirement, retention, or deletion
under defined triggers. Feedback arrows run from monitoring (8) and
disposition (9) back to the owner (1), the authority decision (2), quality
testing (4), and the approval gate (7), dashed and visually distinct from
the solid main sequence. Entry condition: a data need is identified. Exit
condition: the record is closed. Must work in black and white.
DESIGN: a serpentine (boustrophedon) layout, stages 1-5 left to right on
row one, stages 6-9 right to left on row two, columns 2/9, 4/7, and 5/6
vertically aligned so the feedback arrows and the row transition run as
short, uncluttered verticals rather than a diagonal tangle across the page.
Deliberately excluded: the specific quality-dimension tests (section 5.3's
own job) and specific governance controls per stage (the rest of the
chapter's job).
SOURCE: original; structure informed by the categories in Gebru et al.,
"Datasheets for Datasets" (arXiv:1803.09010), redrawn in this book's own
visual language and reordered to place authority before collection, not
reproduced from that source's own sequence.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x].
CH026 correction APPLIED. Checked 13 Sep 2026.
-->
