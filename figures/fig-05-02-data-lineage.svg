<line x1="176" y1="135" x2="184" y2="135" stroke="#1a2230" stroke-width="1.6"/><polygon points="193,135 184,131 184,139" fill="#1a2230"/>
<line x1="349" y1="135" x2="357" y2="135" stroke="#1a2230" stroke-width="1.6"/><polygon points="366,135 357,131 357,139" fill="#1a2230"/>
