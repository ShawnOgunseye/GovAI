<circle cx="726" cy="249" r="8" fill="#1a2230"/><text x="726" y="252.2" class="num" fill="#ffffff" text-anchor="middle">6</text>
<text x="790" y="265" class="bx" fill="#1a2230" text-anchor="middle">REASSESS</text>
