<line x1="271" y1="315" x2="271" y2="337" stroke="#1a2230" stroke-width="1.6"/><polygon points="271,345 267,337 275,337" fill="#1a2230"/>
<rect x="20" y="345" width="280" height="38" rx="3" fill="#eef1f5" stroke="#1a2230" stroke-width="1"/>
<text x="160" y="362" class="sm" fill="#1a2230" text-anchor="middle">EXIT: the record is closed, corrected,</text>
<text x="160" y="375" class="sm" fill="#1a2230" text-anchor="middle">retired, retained, or deleted</text>
<line x1="20" y1="400" x2="880" y2="400" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="423" class="lg" fill="#1a2230">Solid arrows are the sequence a dataset moves through, once, per use. Dashed arrows are monitoring and</text>
<text x="20" y="441" class="lg" fill="#1a2230">disposition findings reassessing an earlier stage: owner and authority (1, 2), quality testing (4), approval (7).</text>
<text x="20" y="463" class="sm" fill="#46536b">A record kept at every stage makes the next stage traceable. A gap at any numbered stage breaks the chain for everything</text>
<text x="20" y="478" class="sm" fill="#46536b">after it: a later check or use decision downstream of an unrecorded step is an assumption, not a traceable fact.</text>
</svg>
