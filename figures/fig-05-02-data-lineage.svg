<circle cx="553" cy="249" r="8" fill="#1a2230"/><text x="553" y="252.2" class="num" fill="#ffffff" text-anchor="middle">7</text>
<text x="617" y="265" class="bx" fill="#1a2230" text-anchor="middle">APPROVAL</text>
<text x="617" y="284" class="sm" fill="#46536b" text-anchor="middle">binds dataset version</text>
<text x="617" y="297" class="sm" fill="#46536b" text-anchor="middle">to model version</text>
