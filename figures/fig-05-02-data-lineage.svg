<line x1="712" y1="275" x2="703" y2="275" stroke="#1a2230" stroke-width="1.6"/><polygon points="695,275 703,271 703,279" fill="#1a2230"/>
<line x1="539" y1="275" x2="530" y2="275" stroke="#1a2230" stroke-width="1.6"/><polygon points="522,275 530,271 530,279" fill="#1a2230"/>
