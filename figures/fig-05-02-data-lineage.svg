<circle cx="207" cy="249" r="8" fill="#1a2230"/><text x="207" y="252.2" class="num" fill="#ffffff" text-anchor="middle">9</text>
<text x="271" y="265" class="bx" fill="#1a2230" text-anchor="middle">DISPOSITION</text>
<text x="271" y="284" class="sm" fill="#46536b" text-anchor="middle">correct, retire,</text>
