<line x1="271" y1="210" x2="98" y2="210" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="271" y1="210" x2="271" y2="183" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
