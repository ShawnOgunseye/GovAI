<line x1="617" y1="215" x2="617" y2="183" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
<polygon points="617,175 613,183 621,183" fill="#46536b"/>
<text x="530" y="209" class="em" fill="#46536b" text-anchor="middle">recheck quality testing (4)</text>
<line x1="444" y1="315" x2="444" y2="329" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="444" y1="329" x2="617" y2="329" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
<line x1="617" y1="329" x2="617" y2="323" stroke="#46536b" stroke-width="1.3" stroke-dasharray="4 3"/>
<polygon points="617,315 613,323 621,323" fill="#46536b"/>
