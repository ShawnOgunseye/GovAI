<svg viewBox="0 0 900 552" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recommender against agent control points">
<!-- FIGURE 12.1 REQUIRED ELEMENTS
Must appear as a comparison canvas: a recommender's control point (review
output before it takes effect) against an agent's control points (permission
scope set in advance, runtime intervention available during execution,
action logged after). Must show the review-before-action point does not
exist on the agent side. Entry condition: a system either recommends or
acts. Exit condition: the governance question each side actually answers
is named (was the output correct, versus what was done and can it be
undone). Deliberately excluded: reversibility classification detail
(12.4 already covers it; this figure is about control point placement, not
action classification). Must work in black and white.
SOURCE: original; the comparison follows this chapter's own section 12.1
argument, restructured as a side-by-side canvas.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Recommender against agent control points</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="552" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 12.1 &#183; Recommender against agent control points</text>
<rect x="30" y="58" width="400" height="40" rx="4" fill="#1a2230"/>
<text x="230.0" y="84" class="cls" fill="#ffffff" text-anchor="middle">RECOMMENDER</text>
<rect x="490" y="58" width="400" height="40" rx="4" fill="#8a3324"/>
<text x="690.0" y="84" class="cls" fill="#ffffff" text-anchor="middle">AGENT</text>
<rect x="30" y="118" width="400" height="90" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="42" y="140" class="bx" font-weight="700" fill="#1a2230">REVIEW BEFORE EFFECT</text>
<text x="42" y="160" class="sm" fill="#1a2230">a discrete output sits for sign-off</text>
<text x="42" y="176" class="sm" fill="#1a2230">before it reaches anyone (Ch. 8)</text>
<text x="42" y="196" class="sm" font-weight="700" fill="#46536b">asks: was the output correct?</text>
<rect x="490" y="118" width="400" height="90" rx="4" fill="#ffffff" stroke="#8794a8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="502" y="140" class="bx" font-weight="700" fill="#8794a8">NO EQUIVALENT</text>
<text x="502" y="160" class="sm" fill="#8794a8">action takes effect before any</text>
<text x="502" y="176" class="sm" fill="#8794a8">single output could be queued</text>
<rect x="490" y="228" width="400" height="68" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="502" y="248" class="bx" font-weight="700" fill="#1a2230">PERMISSION SCOPE, SET IN ADVANCE</text>
<text x="502" y="266" class="sm" fill="#1a2230">constrains what can be</text>
<text x="502" y="281" class="sm" fill="#1a2230">decided before execution (12.3)</text>
<rect x="490" y="308" width="400" height="68" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="502" y="328" class="bx" font-weight="700" fill="#1a2230">RUNTIME INTERVENTION, DURING</text>
<text x="502" y="346" class="sm" fill="#1a2230">halt or circuit breaker while</text>
<text x="502" y="361" class="sm" fill="#1a2230">the agent is still acting (12.5)</text>
<rect x="490" y="388" width="400" height="68" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="502" y="408" class="bx" font-weight="700" fill="#1a2230">ACTION LOGGED, AFTER</text>
<text x="502" y="426" class="sm" fill="#1a2230">recorded for the authority chain</text>
<text x="502" y="441" class="sm" fill="#1a2230">Chapter 15 requires (12.2)</text>
<text x="490" y="486" class="sm" font-weight="700" fill="#8a3324">asks: what was done, by whom, and can it be undone?</text>
<line x1="20" y1="502" x2="880" y2="502" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="518" class="sm" fill="#46536b">The agent side has no box in the recommender's row: there is no discrete output left to review before it</text>
<text x="20" y="536" class="sm" fill="#46536b">takes effect, which is why control moves to what surrounds the action instead of the action itself.</text>
</svg>