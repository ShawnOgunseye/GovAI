<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0101t f0101d">
<!-- REQUIRED ELEMENTS
  Three system classes: predictive, generative, agentic. All three.
  Shared input and model stages visibly common to all three rows.
  What leaves each system, named and different per row.
  The governing question per row, stated.
  The control point per row, and it must move leftward down the rows.
  Entry (input) present on every row; exit is what leaves.
  Row 3 must show the permission gate sitting BEFORE the model.
  EXCLUDED: hybrid systems combining classes. Named in prose, not drawn.
  SOURCE: original. No published taxonomy expresses the control-point shift.
  AUDIT: pass 1 [x] against list · pass 2 blind [x] · rendered and viewed [x]
-->
<title id="f0101t">Three kinds of system and where governance attaches</title>
<desc id="f0101d">A table of three rows. Each row runs input, model, and what leaves. Predictive systems emit a judgment, governed by asking whether it was right and right for everyone, with the control point at output review. Generative systems emit content, governed by asking whether it was grounded and marked, with the control point at generation. Agentic systems emit an action, governed by asking what was done under whose authority and whether it can be undone; a permission gate sits before the model, because output review comes too late.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2B3A42"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#B3541E"/></marker>
</defs>
<g font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

<g font-size="11" fill="#2B3A42" font-family="'IBM Plex Mono',monospace" letter-spacing="1">
<text x="20" y="30">SYSTEM</text><text x="150" y="30">INPUT</text><text x="248" y="30">MODEL</text>
<text x="374" y="30">WHAT LEAVES</text><text x="530" y="30">GOVERNING QUESTION</text><text x="782" y="30">CONTROL POINT</text>
</g>
<line x1="20" y1="42" x2="940" y2="42" stroke="#2B3A42" stroke-width="1.5"/>

<g>
<text x="20" y="106" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" letter-spacing="1">PREDICTIVE</text>
<rect x="150" y="76" width="70" height="58" rx="3" fill="#B8C4CA" stroke="#2B3A42" stroke-width="1"/>
<line x1="224" y1="105" x2="242" y2="105" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="248" y="76" width="80" height="58" rx="3" fill="#F4F6F7" stroke="#2B3A42" stroke-width="1.5"/>
<line x1="332" y1="105" x2="368" y2="105" stroke="#2B3A42" stroke-width="2" marker-end="url(#a)"/>
<rect x="374" y="76" width="126" height="58" rx="3" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2"/>
<text x="437" y="100" font-size="14" font-weight="600" text-anchor="middle" fill="#1F6FEB">a judgment</text>
<text x="437" y="120" font-size="11.5" text-anchor="middle" fill="#2B3A42">score, class, rank</text>
<text x="530" y="99" font-size="13" fill="#2B3A42">Was it right?</text>
<text x="530" y="119" font-size="13" fill="#2B3A42">Was it right for everyone?</text>
<rect x="782" y="85" width="150" height="40" rx="3" fill="#F4F6F7" stroke="#2B3A42" stroke-width="1"/>
<text x="857" y="110" font-size="12" text-anchor="middle" fill="#2B3A42">output review</text>
</g>

<line x1="20" y1="164" x2="940" y2="164" stroke="#B8C4CA" stroke-width="1"/>

<g>
<text x="20" y="228" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" letter-spacing="1">GENERATIVE</text>
<rect x="150" y="198" width="70" height="58" rx="3" fill="#B8C4CA" stroke="#2B3A42" stroke-width="1"/>
<line x1="224" y1="227" x2="242" y2="227" stroke="#2B3A42" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="248" y="198" width="80" height="58" rx="3" fill="#F4F6F7" stroke="#2B3A42" stroke-width="1.5"/>
<line x1="332" y1="227" x2="368" y2="227" stroke="#2B3A42" stroke-width="2" marker-end="url(#a)"/>
<rect x="374" y="198" width="126" height="58" rx="3" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2"/>
<text x="437" y="222" font-size="14" font-weight="600" text-anchor="middle" fill="#1F6FEB">content</text>
<text x="437" y="242" font-size="11.5" text-anchor="middle" fill="#2B3A42">text, image, code</text>
<text x="530" y="221" font-size="13" fill="#2B3A42">No ground truth to check.</text>
<text x="530" y="241" font-size="13" fill="#2B3A42">Grounded? Marked?</text>
<rect x="782" y="207" width="150" height="40" rx="3" fill="#F4F6F7" stroke="#2B3A42" stroke-width="1"/>
<text x="857" y="232" font-size="12" text-anchor="middle" fill="#2B3A42">generation</text>
</g>

<line x1="20" y1="286" x2="940" y2="286" stroke="#B8C4CA" stroke-width="1"/>

<g>
<text x="20" y="350" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#B3541E" letter-spacing="1">AGENTIC</text>
<rect x="150" y="320" width="70" height="58" rx="3" fill="#B8C4CA" stroke="#2B3A42" stroke-width="1"/>
<line x1="224" y1="349" x2="240" y2="349" stroke="#B3541E" stroke-width="1.5" marker-end="url(#ax)"/>
<rect x="248" y="320" width="80" height="58" rx="3" fill="#FFFFFF" stroke="#B3541E" stroke-width="2.5"/>
<text x="288" y="345" font-size="12" font-weight="600" text-anchor="middle" fill="#B3541E">permission</text>
<text x="288" y="362" font-size="11" text-anchor="middle" fill="#B3541E">gate</text>
<line x1="332" y1="349" x2="348" y2="349" stroke="#B3541E" stroke-width="1.5" marker-end="url(#ax)"/>
<rect x="356" y="320" width="60" height="58" rx="3" fill="#F4F6F7" stroke="#2B3A42" stroke-width="1.5"/>
<text x="386" y="353" font-size="11" text-anchor="middle" fill="#2B3A42">model</text>
<line x1="420" y1="349" x2="436" y2="349" stroke="#2B3A42" stroke-width="2" marker-end="url(#a)"/>
<rect x="442" y="320" width="58" height="58" rx="3" fill="#FFFFFF" stroke="#B3541E" stroke-width="2"/>
<text x="471" y="345" font-size="12" font-weight="600" text-anchor="middle" fill="#B3541E">an</text>
<text x="471" y="362" font-size="12" font-weight="600" text-anchor="middle" fill="#B3541E">action</text>
<text x="530" y="337" font-size="13" fill="#2B3A42">What was done, on whose</text>
<text x="530" y="355" font-size="13" fill="#2B3A42">authority? Can it be undone?</text>
<rect x="782" y="329" width="150" height="40" rx="3" fill="#F4F6F7" stroke="#B3541E" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="857" y="345" font-size="11.5" text-anchor="middle" fill="#B3541E">output review</text>
<text x="857" y="361" font-size="11.5" text-anchor="middle" fill="#B3541E">comes too late</text>
</g>

<line x1="20" y1="418" x2="940" y2="418" stroke="#B8C4CA" stroke-width="1"/>
<text x="20" y="450" font-size="13.5" fill="#2B3A42">The control point moves left as you go down. For an agent it moves in front of the model, because by the time</text>
<text x="20" y="472" font-size="13.5" fill="#2B3A42">there is an output to inspect, the act has already happened.</text>
</g>
</svg>
