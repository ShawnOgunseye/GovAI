<svg viewBox="0 0 900 450" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0501t fig0501d" aria-label="What data surface exists, by path and by system class">
<title id="fig0501t">What data surface exists, by path and by system class</title>
<desc id="fig0501d">A comparison table crossing two paths, build and buy, against three system classes, predictive, generative, and agentic. The build-path row shows training data and runtime data present and directly governed for every class. The buy-path row never shows an empty training-data cell: it marks training data as existing upstream, at the vendor, with limited or no direct access or control, while showing runtime data always present, and a retrieval corpus and fine-tuning data present and directly governed for the generative class specifically. No cell in the figure is a control; it maps where a control would have something to act on.</desc>
<!-- FIGURE 5.1 REQUIRED ELEMENTS
Must appear: two paths (build, buy) as rows, three system classes
(predictive, generative, agentic) as columns, and for each of the six
cells which of the four data kinds (training, fine-tuning, retrieval
corpus, runtime) is actually present. Must show explicitly that the buy
path is not empty: it still carries fine-tuning, corpus, or runtime data
depending on system class, AND that training data on the buy path is not
absent but exists upstream with limited or no direct access or control
(CH025/CH537 correction: the buy-path training-data cell must never read
as a false absence). Entry condition: a system is selected or built. Exit
condition: its data surface is named. Deliberately excluded: specific
governance controls for each cell; that is the rest of the chapter's job,
not this figure's. Must work in black and white.
DESIGN: three fill states carry the distinction, not colour. Dark fill:
an owned corpus the organization holds and can inspect directly (training
data on the build path; retrieval corpus and fine-tuning data on the buy
path, which remain under direct organizational control even though the
base model's own training data is not). Pale solid fill: runtime data,
governed at the point of use, present for every cell. Pale dashed fill:
present but upstream, at the vendor, not directly accessible or
governable from where the deploying organization sits — this is the
corrected buy-path training-data marker, distinct from true absence.
SOURCE: original; no published framework organizes data governance by
this build/buy by system-class cross, which is this book's own argument.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x]
Rebuilt to close CH025/CH537 (buy-path training data previously read as
simple absence; corrected to the exists-upstream/not-accessible marker
the chapter prose at section 5.1 specifies) and to add the buy-path
generative column's own upstream training-data marker, previously
omitted entirely. Checked 13 Sep 2026.
-->
