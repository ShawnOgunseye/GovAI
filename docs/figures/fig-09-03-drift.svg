<svg viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drift detection and response">
<!-- FIGURE 9.3 REQUIRED ELEMENTS
Must appear: input drift and concept drift as two distinct rows, each with
its detection signal and its appropriate response, showing the responses
differ (data/representativeness fix vs. retraining). Must include the
selection-path source: drift originating from a developer changing the
model beneath a deployment, not from the deploying organization's own
population. Entry condition: a system is in production and generating
inputs and, eventually, ground truth. Exit condition: drift type
identified and matched to its response, not treated as one undifferentiated
signal. Must work in black and white.
SOURCE: original; input/concept drift distinction is standard in machine
learning operations practice; the figure's presentation, and the
selection-path addition, are original to this book.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Drift detection and response</title>
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:14px;font-weight:700;}
.bx{font-size:12.5px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:11px;font-weight:400;}
.em{font-size:11px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 9.3 &#183; Drift detection and response</text>
<text x="30" y="46" class="col" fill="#46536b">TYPE</text>
<text x="220" y="46" class="col" fill="#46536b">DETECTION SIGNAL</text>
<text x="560" y="46" class="col" fill="#46536b">RESPONSE</text>
<line x1="20" y1="62" x2="880" y2="62" stroke="#1a2230" stroke-width="1.6"/>
<rect x="20" y="76" width="860" height="110" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="30" y="98" class="bx" font-weight="700" fill="#1a2230">INPUT DRIFT</text>
<text x="30" y="120" class="em" fill="#46536b">distribution of</text>
<text x="30" y="133" class="em" fill="#46536b">inputs changes; the</text>
<text x="30" y="146" class="em" fill="#46536b">input-outcome</text>
<text x="30" y="159" class="em" fill="#46536b">relationship does</text>
<text x="30" y="172" class="em" fill="#46536b">not</text>
<text x="220" y="100" class="sm" fill="#1a2230">detectable from input stream alone, no</text>
<text x="220" y="115" class="sm" fill="#1a2230">ground truth needed</text>
<text x="560" y="100" class="sm" fill="#1a2230">often a data or representativeness</text>
<text x="560" y="115" class="sm" fill="#1a2230">fix, not a full retrain</text>
<rect x="20" y="202" width="860" height="96" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.4"/>
<text x="30" y="224" class="bx" font-weight="700" fill="#1a2230">CONCEPT DRIFT</text>
<text x="30" y="246" class="em" fill="#46536b">the input-outcome</text>
<text x="30" y="259" class="em" fill="#46536b">relationship itself</text>
<text x="30" y="272" class="em" fill="#46536b">changes</text>
<text x="220" y="226" class="sm" fill="#1a2230">detectable only once ground truth, however</text>
<text x="220" y="241" class="sm" fill="#1a2230">delayed, reveals the divergence</text>
<text x="560" y="226" class="sm" fill="#1a2230">retraining on data reflecting the</text>
<text x="560" y="241" class="sm" fill="#1a2230">new relationship</text>
<rect x="20" y="314" width="860" height="96" rx="4" fill="#eef1f5" stroke="#8a3324" stroke-width="1.4"/>
<text x="30" y="336" class="bx" font-weight="700" fill="#1a2230">DEVELOPER-SIDE</text>
<text x="30" y="352" class="bx" font-weight="700" fill="#1a2230">DRIFT</text>
<text x="30" y="374" class="em" fill="#46536b">a purchased model</text>
<text x="30" y="387" class="em" fill="#46536b">changes beneath an</text>
<text x="30" y="400" class="em" fill="#46536b">unchanged interface</text>
<text x="220" y="338" class="sm" fill="#1a2230">detectable only by tracking the deployed</text>
<text x="220" y="353" class="sm" fill="#1a2230">model version directly (Ch. 6)</text>
<text x="560" y="338" class="sm" fill="#1a2230">escalate to the vendor</text>
<text x="560" y="353" class="sm" fill="#1a2230">relationship; re-run Ch. 7</text>
<text x="560" y="368" class="sm" fill="#1a2230">validation on the new version</text>
<line x1="20" y1="432" x2="880" y2="432" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="456" class="sm" fill="#46536b">Two rows require genuinely different responses, not one drift alarm with two causes sorted out afterward.</text>
<text x="20" y="474" class="sm" fill="#46536b">The third row sits outside both mechanisms and is checkable only by tracking the deployed model's version</text>
<text x="20" y="492" class="sm" fill="#46536b">directly.</text>
</svg>
