<text x="767" y="207" font-size="11.5" text-anchor="middle" fill="#2B3A42">harmonised standards</text>
<text x="767" y="224" font-size="11" text-anchor="middle" fill="#B3541E">dependency · check status</text>
<line x1="767" y1="236" x2="767" y2="250" stroke="#2B3A42" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="767" y1="266" x2="767" y2="396" stroke="#2B3A42" stroke-width="1" stroke-dasharray="3 3"/>
</g>
</svg>
