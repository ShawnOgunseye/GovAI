<svg viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0201t f0201d">
<!-- REQUIRED ELEMENTS
  Two bands: obligations in force, and obligations deferred.
  Entry: AI Act entry into force. Exit: final deferred deadline.
  Every dated obligation named with its date: prohibitions+literacy Feb 2025;
  GPAI Aug 2025; Art 50 transparency Aug 2026; marking grace Dec 2026;
  Annex III high-risk Dec 2027; Annex I high-risk Aug 2028.
  Digital Omnibus in-force date marked, Jul 2026.
  Harmonised standards dependency marked BEFORE the deferred deadline,
  because that dependency is what caused the deferral.
  Original Aug 2026 high-risk date shown struck, so the move is visible.
  EXCLUDED: penalties, member-state designation deadlines. Prose only.
  SOURCE: dates from Reg (EU) 2024/1689 and Reg (EU) 2026/1744. Layout original.
  AUDIT: pass 1 [x] · pass 2 blind [x] · rendered and viewed [x]
  VERIFY ALL DATES AGAINST CONSOLIDATED TEXT BEFORE PUBLICATION
-->
<title id="f0201t">EU AI Act obligations and when each applies, as amended</title>
<desc id="f0201d">A timeline from 2024 to 2028. Above the axis, obligations already in force: prohibitions and AI literacy from February 2025, general purpose model duties from August 2025, and Article 50 transparency from August 2026 with a marking grace period to December 2026. Below the axis, the deferred high-risk conformity obligations, moved from a struck-through August 2026 to December 2027 for standalone Annex III systems and August 2028 for embedded Annex I systems. The harmonised standards dependency is marked before the deferred deadline, because it is what caused the deferral.</desc>
<g font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

<text x="30" y="30" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#1F6FEB" letter-spacing="1.4">IN FORCE</text>
<line x1="30" y1="40" x2="970" y2="40" stroke="#1F6FEB" stroke-width="1"/>

<g stroke="#1F6FEB" stroke-width="1" stroke-dasharray="3 3">
<line x1="252" y1="96" x2="252" y2="252"/><line x1="392" y1="176" x2="392" y2="252"/><line x1="598" y1="96" x2="598" y2="252"/>
</g>
<circle cx="252" cy="90" r="6" fill="#1F6FEB"/><circle cx="392" cy="170" r="6" fill="#1F6FEB"/><circle cx="598" cy="90" r="6" fill="#1F6FEB"/>

<rect x="266" y="62" width="216" height="44" rx="3" fill="#FFFFFF" stroke="none"/>
<text x="266" y="82" font-size="13" fill="#2B3A42">Prohibitions and AI literacy</text>
<text x="266" y="100" font-size="11.5" fill="#2B3A42" opacity="0.72">2 Feb 2025</text>

<rect x="406" y="142" width="184" height="44" rx="3" fill="#FFFFFF" stroke="none"/>
<text x="406" y="162" font-size="13" fill="#2B3A42">General purpose AI models</text>
<text x="406" y="180" font-size="11.5" fill="#2B3A42" opacity="0.72">2 Aug 2025</text>

<rect x="612" y="62" width="330" height="44" rx="3" fill="#FFFFFF" stroke="none"/>
<text x="612" y="82" font-size="13" fill="#2B3A42">Article 50 transparency</text>
<text x="612" y="100" font-size="11.5" fill="#2B3A42" opacity="0.72">2 Aug 2026 · marking grace to 2 Dec 2026</text>

<line x1="60" y1="258" x2="960" y2="258" stroke="#2B3A42" stroke-width="2"/>
<g stroke="#B8C4CA" stroke-width="1">
<line x1="60" y1="252" x2="60" y2="264"/><line x1="240" y1="252" x2="240" y2="264"/><line x1="470" y1="252" x2="470" y2="264"/>
<line x1="700" y1="252" x2="700" y2="264"/><line x1="900" y1="252" x2="900" y2="264"/></g>
<g font-size="11" font-family="'IBM Plex Mono',monospace" fill="#2B3A42" letter-spacing="1">
<text x="60" y="282">2024</text><text x="240" y="282">2025</text><text x="470" y="282">2026</text><text x="700" y="282">2027</text><text x="900" y="282">2028</text>
</g>

<circle cx="574" cy="258" r="7" fill="#B3541E"/>
<rect x="466" y="296" width="220" height="42" rx="3" fill="#FFFFFF" stroke="none"/>
<text x="466" y="314" font-size="12.5" font-weight="600" fill="#B3541E">Digital Omnibus in force</text>
<text x="466" y="332" font-size="11.5" fill="#B3541E" opacity="0.85">27 Jul 2026</text>

<text x="30" y="378" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#B3541E" letter-spacing="1.4">DEFERRED</text>
<line x1="30" y1="388" x2="970" y2="388" stroke="#B3541E" stroke-width="1"/>

<g>
<line x1="536" y1="424" x2="612" y2="424" stroke="#B8C4CA" stroke-width="3"/>
<line x1="530" y1="424" x2="618" y2="424" stroke="#B3541E" stroke-width="1.5"/>
<text x="518" y="446" font-size="11" fill="#B8C4CA">was 2 Aug 2026</text>
<line x1="626" y1="424" x2="756" y2="424" stroke="#B3541E" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="764" cy="424" r="6.5" fill="#B3541E"/>
<rect x="620" y="398" width="248" height="22" rx="2" fill="#FFFFFF" stroke="none"/>
<text x="626" y="414" font-size="12.5" fill="#2B3A42">Annex III standalone · 2 Dec 2027</text>
<line x1="772" y1="424" x2="898" y2="424" stroke="#B3541E" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="906" cy="424" r="6.5" fill="#B3541E"/>
<rect x="700" y="440" width="230" height="20" rx="2" fill="#FFFFFF" stroke="none"/>
<text x="700" y="454" font-size="12.5" fill="#2B3A42">Annex I embedded · 2 Aug 2028</text>
</g>

