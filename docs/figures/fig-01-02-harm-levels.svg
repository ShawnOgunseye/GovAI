<svg viewBox="0 0 1300 496" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0102t f0102d" aria-label="Harm level changes what must be observed and remedied">
<title id="f0102t">Harm level changes what must be observed and remedied</title>
<desc id="f0102d">A matrix with five rows, individual, group, organizational, societal, and environmental harm, each naming a documented exemplar or evidence type, against four control columns: prevent, detect, respond and remedy, and learn and change. Every row carries a control in every column. Individual harm is caught most distinctively through audit and complaint review and answered through disclosure and correction. Group harm is caught through disaggregated testing. Organizational harm is answered through incident response. Societal and environmental harm are prevented earliest, at the decision to build and the choice of model and infrastructure, and are also detected through ongoing monitoring. This is an author-proposed synthesis, not a universal observed process, and the rows carry no severity order.</desc>
<!-- REQUIRED ELEMENTS
  Rebuilt per CH pass-47 CH590/CH417 spec, method following the Chapter 18
  Figure 18.1 rebuild in Pass 32: a black/white/grey matrix, no dot-grid, no
  unexplained weight, monochrome-verified, rendered and collision-checked
  before delivery.
  One black/white/grey matrix. Five rows: individual, group, organizational,
  societal, environmental. Each row names a documented exemplar or evidence
  type and is scored against four control columns: prevent, detect, respond
  and remedy, learn and change. Every row has text in every column: no row
  reduces to a single stage. Bold marks the one or two columns each row's
  own case-evidence source (see CASE_SOURCES.md) shows carrying the most
  distinctive weight for that harm level; it is not a severity ranking
  between rows, and rows are not ordered by how bad the harm is.
  EXCLUDED: filled/open dots, icons, gradients, colour coding, severity order.
  SOURCE: NIST AI 600-1 Generative AI Profile; NIST AI RMF Measure playbook;
  this chapter's own documented cases (CASE_SOURCES.md). Matrix structure,
  cell content and emphasis pattern original, per CH590.
  REPLACES the dot-grid version flagged under CH009/CH417 (Pass 16) for
  bottom overflow, a text/line collision, and unexplained dot weight.
  Pass 48 CH417 repair: added aria-label, moved title/desc immediately after
  the opening svg tag, and replaced the ORGANIZATIONAL and SOCIETAL exemplar
  cells (previously sourcing-instruction placeholder text) with the two
  named exemplars CH verified with primary sources: the EEOC's iTutorGroup
  settlement and the FCC's AI-voice robocall ruling. Final-size type-scale
  and layout (CH417 defect 1) remains OPEN, logged in badw-book-log.md
  Pass 48; it is a page-format decision this pass did not make unilaterally.
  Pass 51 CH417 repair: every fill/stroke of #2B3A42 (a blue-tinted dark,
  not a neutral grey) replaced with #1A1A1A, matching the header ink
  already in use in this file. Palette is now #ffffff, #1A1A1A, #BFBFBF
  only. Re-checked well-formed (xmllint) and re-rendered (rsvg-convert)
  after the change; no clipping or collision introduced. CH's Pass 51 ask
  to replace the ENVIRONMENTAL row's "measured evidence" exemplar with a
  cited measured case was not actioned; see badw-book-log.md Pass 51 (the
  chapter's own prose at the matching passage states, and gives the reason,
  that it deliberately does not pin this figure to a fast-moving specific
  number). The "rows carry no severity order" sentence CH asked to
  preserve was already present in both the desc and the footer and both
  are unchanged. Final-size type-scale/layout remains OPEN as in Pass 48.
  Checked 13 Sep 2026.
-->
