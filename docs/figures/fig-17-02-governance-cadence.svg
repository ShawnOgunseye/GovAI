<text x="160.0" y="126" class="sm" fill="#8794a8">model update, prompt change, or feature ships roughly every few days</text>
<text x="20" y="195" class="col" fill="#46536b">PROGRAM</text>
<text x="20" y="210" class="sm" fill="#46536b">(quarters)</text>
<line x1="160" y1="190" x2="860" y2="190" stroke="#1a2230" stroke-width="1.6"/>
<line x1="160.0" y1="181" x2="160.0" y2="199" stroke="#1a2230" stroke-width="1.8"/>
<text x="247.5" y="174" class="sm" fill="#46536b" text-anchor="middle">Q1</text>
<line x1="335.0" y1="181" x2="335.0" y2="199" stroke="#1a2230" stroke-width="1.8"/>
<text x="422.5" y="174" class="sm" fill="#46536b" text-anchor="middle">Q2</text>
<line x1="510.0" y1="181" x2="510.0" y2="199" stroke="#1a2230" stroke-width="1.8"/>
<text x="597.5" y="174" class="sm" fill="#46536b" text-anchor="middle">Q3</text>
<line x1="685.0" y1="181" x2="685.0" y2="199" stroke="#1a2230" stroke-width="1.8"/>
<text x="772.5" y="174" class="sm" fill="#46536b" text-anchor="middle">Q4</text>
<line x1="860.0" y1="181" x2="860.0" y2="199" stroke="#1a2230" stroke-width="1.8"/>
<text x="160.0" y="216" class="sm" fill="#8794a8">governance body meeting, policy revision, or training update roughly once a quarter</text>
<line x1="160" y1="240" x2="160" y2="254" stroke="#8a3324" stroke-width="1.6"/>
<line x1="160" y1="254" x2="335.0" y2="254" stroke="#8a3324" stroke-width="1.6"/>
<line x1="335.0" y1="240" x2="335.0" y2="254" stroke="#8a3324" stroke-width="1.6"/>
<text x="247.5" y="272" class="em" fill="#8a3324" text-anchor="middle">roughly six system-level changes occur within a single governance cycle</text>
<line x1="20" y1="300" x2="880" y2="300" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="328" class="col" fill="#46536b">STRUCTURAL RESPONSES (SECTION 17.11)</text>
<rect x="20" y="352" width="860" height="44" rx="4" fill="#eef1f5" stroke="#c9d1dc" stroke-width="1"/>
<text x="32" y="370" class="bx" font-weight="700" fill="#1a2230">Embed in tooling</text>
<text x="32" y="387" class="sm" fill="#46536b">Compliance happens as a byproduct of the development workflow, not a separate gate bolted onto it.</text>
<rect x="20" y="406" width="860" height="44" rx="4" fill="#eef1f5" stroke="#c9d1dc" stroke-width="1"/>
<text x="32" y="424" class="bx" font-weight="700" fill="#1a2230">Automate what can be automated</text>
<text x="32" y="441" class="sm" fill="#46536b">A mechanical check runs at system speed even where a human review cannot (17.6).</text>
<rect x="20" y="460" width="860" height="44" rx="4" fill="#eef1f5" stroke="#c9d1dc" stroke-width="1"/>
<text x="32" y="478" class="bx" font-weight="700" fill="#1a2230">Tier by risk</text>
<text x="32" y="495" class="sm" fill="#46536b">Only systems whose stakes justify a quarterly-cycle review actually go through one.</text>
<rect x="20" y="514" width="860" height="44" rx="4" fill="#eef1f5" stroke="#c9d1dc" stroke-width="1"/>
<text x="32" y="532" class="bx" font-weight="700" fill="#1a2230">Shift toward runtime monitoring</text>
<text x="32" y="549" class="sm" fill="#46536b">Weight moves from pre-deployment gates to the ongoing monitoring Chapters 9 and 12 established.</text>
<line x1="20" y1="582" x2="880" y2="582" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="604" class="sm" fill="#46536b">None of the four responses closes the gap entirely; a program claiming full elimination should be read</text>
<text x="20" y="622" class="sm" fill="#46536b">skeptically, for the same reason a clean-looking process can signal theater rather than function (17.2).</text>
</svg>