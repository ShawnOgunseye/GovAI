<svg viewBox="0 0 900 650" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Governance cadence against development cadence">
<!-- FIGURE 17.2 REQUIRED ELEMENTS
Must appear: system development cadence (days) set against governance
program cadence (quarters) on a shared timeline, making the mismatch
visually explicit rather than only asserted in prose, paired with the
named structural responses this section gives for closing the gap
(embed in tooling, automate, tier by risk, shift toward runtime
monitoring). Entry condition: the bypass dynamics of 17.9 and 17.10 have
already established that a mismatch produces workarounds. Exit
condition: the scale mismatch and the responses to it are both legible
from the figure alone. Deliberately excluded: the bypass case narrative
(the case in focus's job). Must work in black and white.
SOURCE: original; the cadence contrast is this chapter's own synthesis
of section 17.11's argument.
AUDIT: pass 1 [x] against list, pass 2 blind [ ], rendered and viewed [x]
-->
<title>Governance cadence against development cadence</title>
