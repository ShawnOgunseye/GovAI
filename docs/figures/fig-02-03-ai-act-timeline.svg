<text x="30" y="30" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#1A1A1A" letter-spacing="1.4">IN FORCE</text>
<line x1="30" y1="40" x2="970" y2="40" stroke="#1A1A1A" stroke-width="1"/>

