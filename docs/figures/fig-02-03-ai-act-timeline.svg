<title id="f0203t">EU AI Act obligations and when each applies, as amended</title>
<desc id="f0203d">A timeline from 2024 to 2028. Above the axis, obligations already in force: prohibitions and AI literacy from February 2025, general purpose model duties from August 2025, and Article 50 transparency from August 2026 with a marking grace period to December 2026. Below the axis, the deferred high-risk conformity obligations, moved from a struck-through August 2026 to December 2027 for standalone Annex III systems and August 2028 for embedded Annex I systems. A standards and guidance readiness milestone is marked before the deferred deadline as a sequence marker only: standards remain voluntary, a citation confers a presumption of conformity only for the requirement it covers, and which assessment route a provider then follows depends on the system's category.</desc>
