<svg viewBox="0 0 1000 994" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0602t fig0602d" aria-label="Model supply chain roles and where obligation attaches">
<title id="fig0602t">Model supply chain roles and where obligation attaches</title>
<desc id="fig0602d">A role-and-duty map, not a single liability chain: ten roles a system can pass through, model or GPAI provider, fine-tuner, data supplier, tool or component provider, importer or distributor, system integrator, API host, deployer, a day-to-day operations role, and affected person, each carrying its own attached duties. Dashed arrows show a role shifting to provider, for a high-risk system, under specified conditions: rebranding, substantial modification, or a changed intended purpose. A side rail carries change notice downward from the provider and contract, incident, logging, and feedback signals upward from every later role.</desc>
<!-- FIGURE 6.2 REQUIRED ELEMENTS, REBUILT per CH036.
CH036 finding: a single chain with universal upstream liability
misdescribes how legal roles actually distribute; EU law assigns distinct
duties to providers, general-purpose-model providers, importers,
distributors, product manufacturers, deployers, and other parties, and a
deployer becomes a provider only in specified circumstances (rebranding,
substantial modification, changed intended purpose).
Must appear: a role-and-duty map, not a single chain: model or GPAI
provider, fine-tuner, API host, system integrator, data supplier,
tool/component provider, importer or distributor (where relevant),
deployer, operator, and affected person, each with its own attached
duties. Conditional dashed arrows show when a role shifts to provider
(rebranding, substantial modification, changed intended purpose).
Contract/change-notice/incident/logging/feedback links shown as a side
rail connecting every role. Deliberately excluded: specific contract
terms (Chapter 16 job). Must work in black and white.
SOURCE: original; no published framework maps obligation attachment to
this specific build/fine-tune/select entry-point structure. Role list
follows the EU AI Act's provider/deployer/importer/distributor
vocabulary without reproducing any single source figure.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed
[x]. Rebuilt to close CH036: replaces the four-box single chain with a
ten-role duty map, conditional role-shift arrows, and a change-notice/
contract/incident/logging/feedback rail. Checked 13 Sep 2026.

CH036/CH445 (Pass 56), partial correction 13 Sep 2026: three rendered
em dashes removed (side-rail labels and the bottom legend). The
provider-role-shift conditions (rebranding, substantial modification,
changed intended purpose) now state they apply "for a high-risk
system," per EU AI Act Article 25(1)'s own scope ("shall be considered
to be a provider of a high-risk AI system"), confirmed against
https://artificialintelligenceact.eu/article/25/. The row labelled
OPERATOR is renamed DAY-TO-DAY OPERATIONS: Article 3(8) defines
"operator" as a collective term for provider, product manufacturer,
deployer, authorised representative, importer, or distributor, not a
distinct sequential role after deployer, confirmed against
https://artificialintelligenceact.eu/article/3/.
CH036/CH445's larger structural finding is NOT resolved by this pass:
the figure still renders ten roles as one mandatory vertical chain with
solid connecting arrows, still gives functional, nonstatutory roles
(fine-tuner, data supplier, tool/component provider, system integrator,
API host) the same box style and "duties" framing as the statutory
roles (provider, deployer, importer/distributor), and does not branch,
mark roles optional/combinable, or separate legal-role determination
from function the way CH's corrected specification requires. That
redesign remains OPEN pending an author/illustrator decision; see
rules/badw-book-log.md, Pass 56.

CH's Pass 56 corrected Figure 6.2 specification, carried here so it
travels with the figure until the redraw happens: center the AI system
or model; surround it with functional actors present in this deployment
only (developer/provider, data supplier, component/tool supplier, host,
integrator, distributor/importer, deployer, operator/user, affected
person, oversight authority), each marked optional, combined, or
separate; add a legal-role determination panel that derives each
actor's statutory role from jurisdiction, activity, market action,
system classification, name/trademark use, intended-purpose change, and
substantial modification, rather than reading the role off the function
label; show Article 25 as a scoped decision branch for high-risk
systems only, not a universal rule; use separate edge types for
product/service flow, data flow, contract, documentation, change
notice, incident report, complaint/appeal, regulator access, and
corrective action, drawn only where evidence supports that relationship
for the stated context; add supplier-failure, evidence-unavailable,
escalation, suspension/recall/withdrawal, correction, and
verified-closure paths; label the organizational process as a
recommended synthesis unless direct evidence documents a named
organization's practice.
-->
