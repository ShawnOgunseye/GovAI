<svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f0202t f0202d">
<!-- FIGURE 2.2 REQUIRED ELEMENTS
Must appear: all four NIST AI RMF functions (Govern, Map, Measure, Manage),
each with its actual outcome stated, not a one-line gloss; Govern shown as
underlying and running across the other three rather than as a first step
in a sequence; Map, Measure, and Manage shown in a continuing cycle rather
than a one-way, terminating sequence, since a manage decision can send a
system back to be re-mapped; an explicit statement that the framework is
voluntary, has no conformity assessment, no accredited body, and no
built-in certificate, so a claim of following it needs independent
testing against artifacts, contracts, or assessment.
Deliberately excluded: a specific organization's actual NIST AI RMF
practice. This figure diagrams the framework's own stated structure; it
does not claim any organization implements it exactly this way, which is
a distinct empirical question this book does not have direct evidence for.
SOURCE: NIST AI RMF 1.0 and the AI RMF Core's own description of Govern as
cross-cutting and of Map, Measure, and Manage as an iterative set of
functions rather than a strict pipeline. Layout and framing original.
CANVAS: architecture, per FIGURE_SPEC.md section 2, with the Govern band
treated as the figure's one boundary element (heavy stroke) that the other
three functions all cross into rather than a component beside them.
AUDIT: pass 1 [x] against this list · pass 2 blind [ ]
ADDED: Pass 17 CH review, finding CH426 (2026-09-13): this figure did not
exist before this pass, against BOOK_SPECIFICATION_v2.md's own Chapter 2
figure list. Built and rendered this pass; blind second-pass review is
tracked at task #37 alongside every other figure in the book.
-->

<title id="f0202t">The NIST AI RMF's four functions</title>
<desc id="f0202d">Three boxes, Map, Measure, and Manage, arranged in a cycle with curved arrows running Map to Measure, Measure to Manage, and Manage back to Map, showing that managing a risk can send the work back to mapping rather than ending the sequence. Below them, a wide Govern band spans the full width, with upward arrows into all three boxes, showing that Govern's policies, roles, and culture run underneath and across the other three functions rather than preceding them as a first step. A footer states that the framework is voluntary, carries no conformity assessment, accredited body, or certificate, and that a claim of following it needs independent testing.</desc>

<defs>
<marker id="arrow22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#46536b"/>
</marker>
<marker id="arrow22b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2230"/>
</marker>
</defs>

<style>
text { font-family: "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.ttl { font-size: 17px; font-weight: 700; fill: #1a2230; }
.col { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #46536b; }
.bx { font-size: 12.5px; fill: #1a2230; }
.sm { font-size: 11px; fill: #46536b; }
.em { font-size: 11px; font-style: italic; fill: #46536b; }
</style>

<g>
<text x="450" y="20" text-anchor="middle" class="ttl">The NIST AI RMF's four functions</text>

<!-- Map -->
<rect x="60" y="70" width="230" height="130" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="76" y="94" class="col">MAP</text>
<text x="76" y="116" class="bx">Establishes the context a</text>
<text x="76" y="134" class="bx">system operates in and</text>
<text x="76" y="152" class="bx">identifies what could go</text>
<text x="76" y="170" class="bx">wrong.</text>

<!-- Measure -->
<rect x="335" y="70" width="230" height="130" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="351" y="94" class="col">MEASURE</text>
<text x="351" y="116" class="bx">Analyzes and tracks those</text>
<text x="351" y="134" class="bx">risks using methods suited</text>
<text x="351" y="152" class="bx">to each one identified.</text>

<!-- Manage -->
<rect x="610" y="70" width="230" height="130" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1.4"/>
<text x="626" y="94" class="col">MANAGE</text>
<text x="626" y="116" class="bx">Prioritizes the measured</text>
<text x="626" y="134" class="bx">risks and acts, which can</text>
<text x="626" y="152" class="bx">send a system back to be</text>
<text x="626" y="170" class="bx">re-mapped rather than closing.</text>

<!-- Cycle arrows: Map -> Measure -->
<line x1="290" y1="135" x2="330" y2="135" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow22)"/>
<!-- Measure -> Manage -->
<line x1="565" y1="135" x2="605" y2="135" stroke="#46536b" stroke-width="1.4" marker-end="url(#arrow22)"/>
<!-- Manage -> Map, curved return path above the boxes -->
<text x="450" y="38" text-anchor="middle" class="em">managing can return a system to be re-mapped, not only proceed</text>
<path d="M 725 66 C 725 46, 175 46, 175 66" fill="none" stroke="#46536b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow22)"/>

<!-- Govern band -->
<rect x="60" y="330" width="780" height="130" rx="4" fill="#eef1f5" stroke="#1a2230" stroke-width="1.8"/>
<text x="80" y="356" class="col">GOVERN</text>
<text x="80" y="378" class="bx">Establishes the policies, roles, and culture the other three functions depend on, and runs across the whole</text>
<text x="80" y="396" class="bx">lifecycle rather than sitting at one point in it. Not a first step that finishes before Map begins.</text>
<text x="80" y="420" class="sm">Weak Govern shows up as a Map, Measure, or Manage step done without an accountable owner, an approved</text>
<text x="80" y="436" class="sm">policy, or a defined escalation path, not as a missing box.</text>

<!-- Vertical connectors, Govern into each function -->
<line x1="175" y1="325" x2="175" y2="204" stroke="#1a2230" stroke-width="1.6" marker-end="url(#arrow22b)"/>
<line x1="450" y1="325" x2="450" y2="204" stroke="#1a2230" stroke-width="1.6" marker-end="url(#arrow22b)"/>
<line x1="725" y1="325" x2="725" y2="204" stroke="#1a2230" stroke-width="1.6" marker-end="url(#arrow22b)"/>

<!-- Footer -->
<rect x="60" y="490" width="780" height="56" rx="4" fill="#ffffff" stroke="#46536b" stroke-width="1"/>
<text x="80" y="512" class="sm">Voluntary framework: no conformity assessment, no accredited body, and no built-in certificate. A claim of</text>
<text x="80" y="530" class="sm">following the AI RMF needs testing against artifacts, contracts, or independent assessment. Section 2.9.</text>
</g>
</svg>
