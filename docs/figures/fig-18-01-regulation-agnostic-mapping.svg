<svg viewBox="0 0 1000 1207" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1801-title fig1801-desc">
<title id="fig1801-title">Regulation-agnostic mapping architecture</title>
<desc id="fig1801-desc">A versioned fact record about a system feeds three independent, separately dated regulation mapping cards for the EU AI Act, Colorado's SB26-189, and NYC Local Law 144, none of which stores or inherits another regulation's conclusion. A separate change-handling panel routes a legal or a system-fact change through analysis, an authorized decision, implementation, validation, archiving, and closure, with an escalation branch for missing, conflicting, or unresolved cases.</desc>
