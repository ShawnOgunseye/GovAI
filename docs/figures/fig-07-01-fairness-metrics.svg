<svg viewBox="0 0 900 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0701t fig0701d" aria-label="Four selected fairness metrics and where they conflict">
<title id="fig0701t">Four selected fairness metrics and where they conflict</title>
<desc id="fig0701d">A selected comparison of four widely used fairness criteria, not an exhaustive list. Calibration is shown as a property of the score itself, before any threshold is applied. Demographic parity, equal opportunity, and equalized odds are shown as properties of a decision made by applying a threshold to that score. The one proven relationship is that calibration and equalized odds cannot generally both hold for imperfect, nontrivial scores when group base rates differ, with perfect prediction as the exception; the figure does not claim every pair of the four is mutually exclusive.</desc>
<!-- FIGURE 7.1 REQUIRED ELEMENTS, REBUILT per CH043, CH044.
Must appear: four widely used criteria (demographic parity, equal
opportunity, equalized odds, calibration), presented explicitly as a
selected comparison, not an exhaustive list, each with a one-line precise
definition. Calibration must be visually distinguished as a property of
the score, while the other three are marked as properties of a
thresholded decision. Must show the impossibility relationship narrowly
and with its conditions: for imperfect, nontrivial scores, calibration
and equalized odds cannot generally both hold when group base rates
differ, and perfect prediction and other degenerate cases are exceptions.
The figure must not imply that every pair of the four criteria is
mutually exclusive. Entry condition: two or more groups with a decision
made about each. Exit condition: a chosen metric, with the tradeoff it
accepts named explicitly, stated as a measured decision outcome instead
of inferred from calibration alone. Deliberately excluded: which metric
is "best"; the chapter's point is that this is a values choice. Must work
in black and white.
DESIGN: a two-tier layout carries the score/decision distinction
structurally rather than by a label alone. Calibration sits alone in an
upper "property of the score" tier; the other three sit in a lower
"properties of a thresholded decision" tier, connected by a labelled
"apply a threshold" arrow. The impossibility relationship is drawn as a
single alert-coloured connector between calibration and equalized odds
only, not a bracket spanning all four, so the figure does not read as a
blanket incompatibility claim.
SOURCE: Kleinberg, Mullainathan, and Raghavan, "Inherent Trade-Offs in the
Fair Determination of Risk Scores" (arXiv:1609.05807); Chouldechova, "Fair
Prediction with Disparate Impact" (arXiv:1610.07524); the figure's
presentation is original.
AUDIT: pass 1 [x] against list, pass 2 blind [x], rendered and viewed [x].
CH043/CH044 corrections applied: added "selected comparison" framing,
scoreV.decision tiering, narrowed impossibility statement with its
condition and exception, removed any all-pairs-conflict implication, and
restated the exit condition as a measured outcome. Checked 13 Sep 2026.
-->
<style>
text{font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;}
.ttl{font-size:17px;font-weight:700;}
.cls{font-size:13.5px;font-weight:700;}
.bx{font-size:11.3px;font-weight:400;}
.col{font-size:11px;font-weight:700;letter-spacing:.06em;}
.sm{font-size:10.6px;font-weight:400;}
.em{font-size:10.3px;font-style:italic;}
</style>
<rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
<text x="20" y="34" class="ttl" fill="#1a2230">Figure 7.1 &#183; Four selected fairness metrics and where they conflict</text>
<text x="20" y="54" class="em" fill="#46536b">A selected comparison, not an exhaustive list of every fairness criterion in use.</text>
<text x="450" y="78" class="col" fill="#46536b" text-anchor="middle">PROPERTY OF THE SCORE ITSELF, BEFORE ANY THRESHOLD</text>
<rect x="280" y="90" width="340" height="86" rx="4" fill="#1a2230"/>
<text x="450" y="114" class="cls" fill="#ffffff" text-anchor="middle">CALIBRATION</text>
<text x="450" y="136" class="bx" fill="#ffffff" text-anchor="middle">A predicted probability means the same thing in</text>
<text x="450" y="152" class="bx" fill="#ffffff" text-anchor="middle">every group: a score of 70% repays about 70% of</text>
<text x="450" y="168" class="bx" fill="#ffffff" text-anchor="middle">the time, in every group separately.</text>
<line x1="450" y1="176" x2="450" y2="207" stroke="#1a2230" stroke-width="1.6"/>
<polygon points="450,215 446,207 454,207" fill="#1a2230"/>
<text x="465" y="198" class="em" fill="#46536b" text-anchor="start">apply a threshold to the score</text>
<text x="450" y="234" class="col" fill="#46536b" text-anchor="middle">PROPERTIES OF A DECISION MADE BY THRESHOLDING THAT SCORE</text>
<rect x="110" y="248" width="200" height="120" rx="4" fill="#46536b"/>
<text x="210" y="270" class="cls" fill="#ffffff" text-anchor="middle">DEMOGRAPHIC PARITY</text>
<text x="210" y="292" class="bx" fill="#ffffff" text-anchor="middle">Equal favorable-outcome</text>
<text x="210" y="308" class="bx" fill="#ffffff" text-anchor="middle">rate across groups,</text>
<text x="210" y="324" class="bx" fill="#ffffff" text-anchor="middle">regardless of underlying</text>
<text x="210" y="340" class="bx" fill="#ffffff" text-anchor="middle">base rate.</text>
<rect x="350" y="248" width="200" height="120" rx="4" fill="#46536b"/>
<text x="450" y="270" class="cls" fill="#ffffff" text-anchor="middle">EQUAL OPPORTUNITY</text>
<text x="450" y="292" class="bx" fill="#ffffff" text-anchor="middle">Equal true positive rate</text>
<text x="450" y="308" class="bx" fill="#ffffff" text-anchor="middle">among applicants who</text>
<text x="450" y="324" class="bx" fill="#ffffff" text-anchor="middle">would actually repay the</text>
<text x="450" y="340" class="bx" fill="#ffffff" text-anchor="middle">loan.</text>
<rect x="590" y="248" width="200" height="120" rx="4" fill="#46536b"/>
<text x="690" y="270" class="cls" fill="#ffffff" text-anchor="middle">EQUALIZED ODDS</text>
<text x="690" y="292" class="bx" fill="#ffffff" text-anchor="middle">Equal opportunity, plus an</text>
<text x="690" y="308" class="bx" fill="#ffffff" text-anchor="middle">equal false positive rate</text>
<text x="690" y="324" class="bx" fill="#ffffff" text-anchor="middle">among applicants who</text>
<text x="690" y="340" class="bx" fill="#ffffff" text-anchor="middle">would not repay.</text>
<line x1="620" y1="133" x2="850" y2="133" stroke="#8a3324" stroke-width="1.8"/>
<line x1="850" y1="133" x2="850" y2="308" stroke="#8a3324" stroke-width="1.8"/>
<line x1="850" y1="308" x2="798" y2="308" stroke="#8a3324" stroke-width="1.8"/>
<polygon points="790,308 798,304 798,312" fill="#8a3324"/>
<text x="856" y="221" class="sm" fill="#8a3324" text-anchor="start" transform="rotate(90 856 221)">CANNOT BOTH HOLD</text>
<line x1="20" y1="386" x2="880" y2="386" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="405" class="sm" fill="#8a3324" font-weight="700">Calibration and equalized odds cannot both hold for imperfect, nontrivial scores when group base rates</text>
<text x="20" y="420" class="sm" fill="#8a3324" font-weight="700">differ. Perfect prediction and other degenerate cases are the exception.</text>
<line x1="20" y1="434" x2="880" y2="434" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="453" class="sm" fill="#1a2230">Not every pair conflicts. Demographic parity and equal opportunity can coexist with each other and with</text>
<text x="20" y="468" class="sm" fill="#1a2230">calibration under conditions review question 6 develops. The relationship marked above is the only one</text>
<text x="20" y="483" class="sm" fill="#1a2230">this figure proves.</text>
<line x1="20" y1="497" x2="880" y2="497" stroke="#c9d1dc" stroke-width="1"/>
<text x="20" y="516" class="sm" fill="#46536b">Exit: a chosen metric, with the tradeoff it accepts named, confirmed by measuring the actual decision outcomes,</text>
<text x="20" y="531" class="sm" fill="#46536b">not inferred from calibration alone. Which metric is "best" is not this figure's question; the choice is a values choice.</text>
</svg>
